server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every response, errors included. A location that declares its own add_header would drop
    # these, so none does.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;

    # SPA client-side routing: serve index.html for any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: forward /api/* to the backend service on the compose
    # network. proxy_pass without a trailing path preserves the full URI, so
    # /api/v1/health -> backend:8080/api/v1/health.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
