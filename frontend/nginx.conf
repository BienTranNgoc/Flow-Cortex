# The backend's CORS check compares Origin with the scheme, host and port it is forwarded, so they
# must be the ones the browser used: the published port (not this container's 8080) and, behind
# Caddy, its https rather than this hop's http.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}
map $http_host $forwarded_port {
    "~:(?<port>[0-9]+)$" $port;
    default              "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every response, errors included. A location that declares its own add_header would drop
    # these, so none does. No default-src: uploads PUT straight to the object store's origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;

    # SPA client-side routing: serve index.html for any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-sent events: no buffering so a heartbeat or event reaches the browser as written. No
    # add_header here, for the reason given above.
    location /api/v1/realtime/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_buffering off;
        proxy_cache off;
        # Ten times the 15 s heartbeat.
        proxy_read_timeout 150s;
    }

    # Same-origin API: forward /api/* to the backend service on the compose
    # network. proxy_pass without a trailing path preserves the full URI, so
    # /api/v1/health -> backend:8080/api/v1/health.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        # Above the backend's flowcortex.media.s3.copy-timeout (2m), which a run start can spend copying inputs.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
