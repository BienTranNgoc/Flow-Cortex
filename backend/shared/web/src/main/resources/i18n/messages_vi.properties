email.confirm.subject=Xác nhận email Flow-Cortex của bạn
email.confirm.body=Xin chào,\n\nHãy xác nhận email để hoàn tất việc tạo tài khoản Flow-Cortex:\n\n{0}\n\nLiên kết có hiệu lực trong {1,number,#} giờ và chỉ dùng được một lần. Nếu bạn không tạo tài khoản, hãy bỏ qua email này.\n
email.passwordLink.subject=Đặt mật khẩu Flow-Cortex của bạn
email.passwordLink.body=Xin chào,\n\nTài khoản Flow-Cortex của bạn chưa có mật khẩu. Hãy mở liên kết này để đăng nhập và chọn mật khẩu:\n\n{0}\n\nLiên kết có hiệu lực trong {1,number,#} phút và chỉ dùng được một lần. Nếu bạn không yêu cầu liên kết này, hãy bỏ qua email này.\n
email.passwordSet.subject=Mật khẩu Flow-Cortex của bạn đã được đặt
email.passwordSet.body=Xin chào,\n\nTài khoản Flow-Cortex của bạn vừa được đặt mật khẩu, và mọi phiên đăng nhập khác đã được kết thúc.\n\nNếu không phải bạn, hãy liên hệ bộ phận hỗ trợ ngay.\n
email.confirmReset.body=Bạn đã yêu cầu đặt lại mật khẩu Flow-Cortex. Địa chỉ này có một tài khoản chưa được xác nhận — hãy xác nhận tài khoản, sau đó chọn mật khẩu và tên của riêng bạn.\n\n{0}\n\nLiên kết có hiệu lực trong {1,number,#} giờ và chỉ dùng được một lần.\n
email.passwordReset.subject=Đặt lại mật khẩu Flow-Cortex của bạn
email.passwordReset.body=Xin chào,\n\nCó người đã yêu cầu đặt lại mật khẩu cho tài khoản Flow-Cortex của bạn. Hãy mở liên kết này để chọn mật khẩu mới:\n\n{0}\n\nLiên kết có hiệu lực trong {1} và chỉ dùng được một lần. Nếu bạn không yêu cầu, hãy bỏ qua email này; mật khẩu của bạn vẫn được giữ nguyên.\n
email.duration.hours={0,number,#} giờ
email.duration.minutes={0,number,#} phút
email.googleSignIn.subject=Tài khoản Flow-Cortex của bạn đăng nhập bằng Google
email.googleSignIn.body=Xin chào,\n\nCó người đã yêu cầu đặt lại mật khẩu cho tài khoản Flow-Cortex của bạn. Tài khoản của bạn chưa có mật khẩu: tài khoản đăng nhập bằng Google. Hãy mở trang đăng nhập và tiếp tục với Google:\n\n{0}\n\nNếu bạn không yêu cầu, hãy bỏ qua email này.\n
email.passwordChanged.subject=Mật khẩu Flow-Cortex của bạn đã được thay đổi
email.passwordChanged.body=Xin chào,\n\nMật khẩu tài khoản Flow-Cortex của bạn vừa được thay đổi.\n\nChúng tôi đã đăng xuất bạn khỏi mọi thiết bị. Một thiết bị đang mở có thể vẫn đăng nhập tối đa 15 phút.\n\nNếu không phải bạn, hãy đặt lại mật khẩu một lần nữa từ trang đăng nhập:\n\n{0}\n

