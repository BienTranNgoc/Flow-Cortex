<!DOCTYPE html>
<html lang="{{lang}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{brand}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f7f9fc;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f9fc;">
<tr>
<td align="center" style="padding:24px 12px;">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;background-color:#ffffff;border:1px solid #e6e9ed;border-radius:8px;">
<tr>
<td style="padding:20px 28px;border-bottom:1px solid #e6e9ed;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;color:#066058;">{{brand}}</td>
</tr>
<tr>
<td style="padding:28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;color:#0c1620;">{{body}}</td>
</tr>
<tr>
<td style="padding:16px 28px;border-top:1px solid #e6e9ed;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#4a5762;">{{footer}}</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
