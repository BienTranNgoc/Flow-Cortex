spring:
  application:
    name: flow-cortex

  # Local defaults for a bare `./gradlew bootRun` against a manually-started
  # Postgres; SPRING_DATASOURCE_* env vars (docker compose) and Testcontainers
  # @ServiceConnection (tests) override them. The password is never defaulted
  # here — set SPRING_DATASOURCE_PASSWORD (see LOCAL_SETUP.md).
  datasource:
    url: jdbc:postgresql://localhost:5432/flowcortex
    username: flowcortex
    driver-class-name: org.postgresql.Driver
    # Each async task can hold two connections at once (a listener's REQUIRES_NEW plus the
    # step transition it opens), so the pool is at least 2 x task.execution.pool.max-size (16)
    # plus headroom for HTTP requests, the reaper and heartbeats. Idle connections stay few:
    # Hikari otherwise holds all 40 open per instance even when nothing runs.
    hikari:
      maximum-pool-size: 40
      minimum-idle: 5

  jpa:
    hibernate:
      # Schema is Flyway-owned; Hibernate only validates its entity mapping
      # against what Flyway already migrated — never
      # mutates the schema itself.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Bounds Boot's own applicationTaskExecutor, which runs every @Async and
  # @ApplicationModuleListener and the engine's inline steps. Declaring an
  # Executor bean instead would switch this one off. A full queue rejects the
  # task; the claimed step is then closed by the reaper.
  task:
    execution:
      # The trace and the run's baggage follow the after-commit listeners and the outbox.
      propagate-context: true
      thread-name-prefix: app-async-
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 30s
    # Inline-step lease heartbeats share this scheduler with the lease reaper; a second
    # thread keeps a long reaper pass from delaying heartbeats past the lease.
    scheduling:
      pool:
        size: 2

  # Broker connection from SPRING_RABBITMQ_HOST/PORT/USERNAME/PASSWORD (compose sets them; no
  # password default is committed here). A listener that cannot record a message tries 3 times in
  # all, 1 s then 2 s apart, and then the message goes to its dead-letter queue; an invalid message
  # goes there at once. The media listeners start only after the topology is declared.
  rabbitmq:
    # Observed: a sent job carries the W3C trace context, a received result continues it.
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

  # The event publication registry is the outbox for job messages. Outstanding publications are
  # not republished on restart — a job in flight would be dispatched twice; failed ones are resubmitted
  # by the media module instead. A completed publication is deleted: the run step is the record.
  modulith:
    events:
      republish-outstanding-events-on-restart: false
      externalization:
        enabled: true
      completion-mode: delete
      staleness:
        published: 5m
        processing: 30m
        resubmitted: 10m

  # Outgoing mail (confirmation and set-password links). Compose points it at the Mailpit
  # sink; a deployment sets its SMTP relay through the same variables. No default host: with email
  # confirmation on, startup fails until one is set (the dev profile uses localhost). Mailpit takes
  # no login; a public relay needs one, sent only after the session has switched to TLS.
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SPRING_MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SPRING_MAIL_SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SPRING_MAIL_SMTP_STARTTLS:false}

server:
  port: 8080
  # The remote address is the client's when nginx (a private-network proxy) sends X-Forwarded-For;
  # Tomcat trusts that header only from private and loopback addresses. The registration limits key on it.
  forward-headers-strategy: native

# Health, info and metrics live on the management port, which compose only exposes inside the
# service network. The API port keeps the anonymous probes /livez and /readyz; the container
# healthchecks use /readyz there, since a probe on another port can be UP while 8080 is broken.
#
# Every request and engine action is traced; the run id travels as baggage across the broker and
# lands in the logs. Spans and log records go out over OTLP only when OTEL_TRACES_EXPORTER /
# OTEL_LOGS_EXPORTER are otlp (Boot maps the OTEL_* variables); without an endpoint nothing is
# exported and trace ids still reach the logs. Metrics are scraped, never pushed.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
        add-additional-paths: true
  # A mail sink outage must not turn the app DOWN: a failed confirmation mail is logged and the
  # member can ask for it again.
  health:
    mail:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields: runId
      correlation:
        fields: runId
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      limits:
        max-attribute-value-length: 4096
    logging:
      limits:
        max-attribute-value-length: 4096

# JDBC observations record the statement, never its parameter values.
jdbc:
  datasource-proxy:
    include-parameter-values: false

# No default here on purpose — a committed real-looking default would trip the
# security-scan secret scanner (Trivy) and ship a known signing key. Only the
# 'dev' profile (application-dev.yml) supplies a fallback; every other
# profile/environment must set JWT_SECRET or JwtKeyConfig fails startup loudly.
flowcortex:
  # The member app's public origin; links in outgoing mail point here. No default: with email
  # confirmation on, startup fails until it is set (the dev profile uses http://localhost:5173).
  app:
    public-url: ${FLOWCORTEX_APP_PUBLIC_URL:}
  security:
    jwt-secret: ${JWT_SECRET:}
    # Browser origins allowed to call /api/v1/** cross-origin (comma-separated, never `*` while
    # credentials are allowed). The apps reach the API same-origin through a proxy, so this only
    # matters for a frontend served from another origin.
    cors:
      allowed-origins: ${FLOWCORTEX_CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allow-credentials: ${FLOWCORTEX_CORS_ALLOW_CREDENTIALS:true}
    # Google OAuth 2.0 — an empty client-id leaves the app booting with Google sign-in off
    # (/authorize answers 503); the deployment sets the real values from Google Cloud Console.
    # redirect-uri is the absolute backend callback URL registered at Google; it must be served
    # on the same origin as the app so the flow cookie reaches it. state-ttl bounds one sign-in
    # attempt; the timeouts bound every call to Google.
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/api/v1/auth/oauth/google/callback}
        state-ttl: ${OAUTH_STATE_TTL:10m}
        connect-timeout: ${GOOGLE_CONNECT_TIMEOUT:5s}
        read-timeout: ${GOOGLE_READ_TIMEOUT:10s}
    # Access JWT lifetime; access tokens stay valid until they expire, even after logout.
    # A refresh session ends `ttl` after login (`remember-me-ttl` when remembered) and rotation
    # never extends it. A user keeps at most `max-active-per-user` live sessions; a new login
    # beyond that revokes the oldest.
    jwt:
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:7d}
      remember-me-ttl: ${REFRESH_TOKEN_REMEMBER_ME_TTL:30d}
      max-active-per-user: ${REFRESH_TOKEN_MAX_ACTIVE_PER_USER:10}
  auth:
    # On: a new registration must confirm its email before it can sign in; needs app.public-url and
    # spring.mail.host, or startup fails. Off: accounts are confirmed on creation and register signs
    # the member in. Env var + restart. Unconfirmed accounts older than the retention, with no live
    # link, are deleted every retention interval (below).
    email-confirmation:
      enabled: ${FLOWCORTEX_AUTH_EMAIL_CONFIRMATION_ENABLED:false}
      unconfirmed-account-retention: ${FLOWCORTEX_AUTH_UNCONFIRMED_ACCOUNT_RETENTION:72h}
    # A scheduled job deletes auth_event rows (they hold IPs and user agents) older than
    # `audit-events`, and refresh-token rows that expired or were revoked, every `interval`.
    retention:
      interval: ${FLOWCORTEX_AUTH_RETENTION_INTERVAL:1h}
      audit-events: ${FLOWCORTEX_AUTH_AUDIT_RETENTION:90d}
  # Password login throttle: each client IP gets `capacity` failed attempts per `period`, refilled
  # gradually; over it answers 429 with Retry-After before the password is checked. Limits are per
  # backend instance. The per-account lockout (5 failures, 15 minutes) is separate.
  login:
    failures-per-ip:
      capacity: ${FLOWCORTEX_LOGIN_FAILURES_PER_IP_CAPACITY:20}
      period: ${FLOWCORTEX_LOGIN_FAILURES_PER_IP_PERIOD:15m}
  # Kill switch for the admin console's API (/api/v1/admin/**): off answers 503 there, after the
  # role checks; /api/v1/users is not affected. Env var + restart, like the workflow one below.
  admin:
    enabled: ${FLOWCORTEX_ADMIN_ENABLED:true}
  # Public self-registration. Accounts belong to the ADMIN named here, who lists and suspends them
  # under /api/v1/users; empty, unknown, not an ADMIN or not ACTIVE closes registration (403).
  # Each client IP and each email (trimmed, lower-cased) gets `capacity` attempts per `period`,
  # refilled gradually; over it answers 429 with Retry-After. Limits are per backend instance.
  registration:
    owner-email: ${FLOWCORTEX_REGISTRATION_OWNER_EMAIL:}
    per-ip:
      capacity: ${FLOWCORTEX_REGISTRATION_PER_IP_CAPACITY:5}
      period: ${FLOWCORTEX_REGISTRATION_PER_IP_PERIOD:1h}
    per-email:
      capacity: ${FLOWCORTEX_REGISTRATION_PER_EMAIL_CAPACITY:3}
      period: ${FLOWCORTEX_REGISTRATION_PER_EMAIL_PERIOD:1h}
  # Phone verification by one-time code (/api/v1/me/phone/**): off answers 503 there. On needs an
  # SMS sender (flowcortex.sms.sender below), or startup fails.
  phone-verification:
    enabled: ${FLOWCORTEX_PHONE_VERIFICATION_ENABLED:false}
    # Send-code quotas, over the last 24 h unless noted; each refusal answers 429 with Retry-After.
    # A member's sends and distinct numbers count "number already verified" answers too. The
    # per-IP bucket is per backend instance; the rest are read from the database.
    limits:
      allowed-country-codes: ${FLOWCORTEX_PHONE_ALLOWED_COUNTRY_CODES:84}
      user-sends-per-day: ${FLOWCORTEX_PHONE_USER_SENDS_PER_DAY:10}
      user-numbers-per-day: ${FLOWCORTEX_PHONE_USER_NUMBERS_PER_DAY:3}
      per-ip:
        capacity: ${FLOWCORTEX_PHONE_PER_IP_CAPACITY:30}
        period: ${FLOWCORTEX_PHONE_PER_IP_PERIOD:1h}
      number-sends-per-day: ${FLOWCORTEX_PHONE_NUMBER_SENDS_PER_DAY:20}
      global-sends-per-day: ${FLOWCORTEX_PHONE_GLOBAL_SENDS_PER_DAY:2000}
    # A scheduled job deletes send attempts (they hold IPs) and outbox messages older than these.
    retention:
      interval: ${FLOWCORTEX_PHONE_RETENTION_INTERVAL:1h}
      send-attempts: ${FLOWCORTEX_PHONE_SEND_ATTEMPT_RETENTION:30d}
      sms-outbox: ${FLOWCORTEX_SMS_OUTBOX_RETENTION:7d}
  # HMAC key for phone_send_attempt.phone_hash; at least 32 bytes when phone verification is on.
  phone:
    hash-secret: ${FLOWCORTEX_PHONE_HASH_SECRET:}
  # Where SMS go. Empty: nowhere. "outbox": the sms_outbox table, read in the admin console
  # (/api/v1/admin/sms-outbox exists only then); development stacks only, nothing is delivered.
  sms:
    sender: ${FLOWCORTEX_SMS_SENDER:}
  # Run credits: off means no balance check at start, no debit or refund, no balance shown.
  # Every registered step type needs a cost here, or startup fails.
  credits:
    enabled: ${FLOWCORTEX_CREDITS_ENABLED:false}
    step-costs:
      echo: 1
      fail: 20
      # Brackets make the map binder keep the key exactly as written (upper case).
      "[APPROVAL_CHECKPOINT]": 0
      probe: 10
      extract_audio: 50
      align_audio: 50
      generate_script: 100
      generate_speech: 100
      generate_storyboard: 100
      generate_video: 200
      render_video: 200
  # Kill switch gating POST
  # /api/v1/workflows/{id}/runs — off means new runs are refused (503), but
  # already-started/finished runs stay readable. Flip via the
  # FLOWCORTEX_WORKFLOW_ENABLED env var + a process restart (no new flag
  # library, no runtime toggle endpoint) — a plain config property, not a
  # DB-backed live toggle.
  workflow:
    enabled: ${FLOWCORTEX_WORKFLOW_ENABLED:true}
    # Member-initiated run cancellation: off answers 503 and the app hides the stop button.
    cancel:
      enabled: ${FLOWCORTEX_WORKFLOW_CANCEL_ENABLED:false}
    # A picked-up step must report within this window (a heartbeat every 30 s)
    # or the reaper closes it as lease_expired; the reaper runs every interval.
    lease-seconds: 120
    reaper-interval-ms: 30000
  # Product Video is opt-in outside development. Turning it off blocks only new
  # Product Video runs; existing runs remain readable and continue advancing.
  product-video:
    enabled: ${FLOWCORTEX_PRODUCT_VIDEO_ENABLED:false}
  # Media engine: the one home of every media timeout and limit (MediaProperties
  # has no code defaults). The kill switch works like the workflow one above —
  # env var + restart. S3_* is provider-neutral, so another S3-compatible store
  # is a configuration change; each service gets its own least-privilege key.
  media:
    enabled: ${FLOWCORTEX_MEDIA_ENABLED:true}
    # How long a dispatched job may wait for a worker to pick it up.
    queue-timeout: ${FLOWCORTEX_MEDIA_QUEUE_TIMEOUT:30m}
    max-runtime:
      probe: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_PROBE:5m}
      extract_audio: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_EXTRACT_AUDIO:10m}
      align_audio: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_ALIGN_AUDIO:10m}
      render_video: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_RENDER_VIDEO:5m}
    # The broker's per-delivery ack deadline; must outlast every max run time.
    consumer-timeout: ${FLOWCORTEX_MEDIA_CONSUMER_TIMEOUT:20m}
    # The provider runtime runs on the same ack deadline, so its ceilings are checked against
    # consumer-timeout too. Both are queue arguments fixed once the queue exists: changing
    # consumer-timeout needs provider.jobs and provider.video.jobs deleted (LOCAL_SETUP.md §3).
    # Script, storyboard and speech jobs (provider.jobs):
    provider-max-runtime: ${FLOWCORTEX_MEDIA_PROVIDER_MAX_RUNTIME:2m}
    provider-queue-timeout: ${FLOWCORTEX_MEDIA_PROVIDER_QUEUE_TIMEOUT:5m}
    # Video clips (provider.video.jobs): a clip polls its vendor for up to 8 minutes, and a third
    # concurrent clip waits for one of the two video workers to finish.
    provider-video-max-runtime: ${FLOWCORTEX_MEDIA_PROVIDER_VIDEO_MAX_RUNTIME:10m}
    provider-video-queue-timeout: ${FLOWCORTEX_MEDIA_PROVIDER_VIDEO_QUEUE_TIMEOUT:15m}
    presign-ttl: 15m
    upload:
      # Per-kind size caps; the kind comes from the file's canonical MIME type. The video cap
      # still honours FLOWCORTEX_MEDIA_UPLOAD_MAX_BYTES, its name before per-kind caps.
      max-video-bytes: ${FLOWCORTEX_MEDIA_UPLOAD_MAX_VIDEO_BYTES:${FLOWCORTEX_MEDIA_UPLOAD_MAX_BYTES:524288000}}
      max-audio-bytes: ${FLOWCORTEX_MEDIA_UPLOAD_MAX_AUDIO_BYTES:104857600}
      max-image-bytes: ${FLOWCORTEX_MEDIA_UPLOAD_MAX_IMAGE_BYTES:10485760}
      # On: an upload whose first bytes do not match its declared kind is refused. The caps apply
      # either way.
      content-check:
        enabled: ${FLOWCORTEX_MEDIA_UPLOAD_CONTENT_CHECK_ENABLED:true}
      # Each extension must map to a canonical MIME type in MediaProperties, or startup fails.
      # `extensions` is the audio/video allowlist (the only types a media capability takes as
      # input); `product-image-extensions` is the image allowlist (product-video feature). Neither
      # may be empty: an empty list fails startup, so leave the env var unset to keep the default.
      extensions: ${FLOWCORTEX_MEDIA_UPLOAD_EXTENSIONS:mp4,mov,webm,mkv,m4a,mp3,wav}
      product-image-extensions: ${FLOWCORTEX_MEDIA_UPLOAD_PRODUCT_IMAGE_EXTENSIONS:jpg,jpeg,png,webp}
      url-ttl: 15m
    s3:
      endpoint: ${S3_ENDPOINT:}
      # The host the member's browser reaches; presigned URLs are signed for it.
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      path-style: ${S3_PATH_STYLE:true}
      upload-bucket: ${S3_UPLOAD_BUCKET:flowcortex-uploads}
      bucket: ${S3_BUCKET:flowcortex-media}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
    # Bound every call the API itself makes to the store, retries included, so a store that
    # accepts the connection and never answers cannot hold a request or a health check.
      api-call-timeout: 5s
      api-call-attempt-timeout: 2s
      # Except a run-input copy: server-side, but it grows with the file (up to max-video-bytes),
      # so it has its own bound for the call and each attempt. It runs before any run transaction.
      copy-timeout: 2m
