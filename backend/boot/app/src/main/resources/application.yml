spring:
  application:
    name: flow-cortex

  # Local defaults for a bare `./gradlew bootRun` against a manually-started
  # Postgres; SPRING_DATASOURCE_* env vars (docker compose) and Testcontainers
  # @ServiceConnection (tests) override them. The password is never defaulted
  # here — set SPRING_DATASOURCE_PASSWORD (see LOCAL_SETUP.md).
  datasource:
    url: jdbc:postgresql://localhost:5432/flowcortex
    username: flowcortex
    driver-class-name: org.postgresql.Driver
    # An async task can hold up to 4 connections at once (listener + advance + claim + workflow.call
    # fact reads), so the pool is at least 4 x task.execution.pool.max-size (16) = 64 plus headroom
    # for HTTP requests, the reaper and heartbeats; the workflow module refuses to start below the
    # 4 x product. Each backend instance opens up to this many, so instances x this must fit in
    # Postgres max_connections (100 by default; compose runs one backend). Idle connections stay few:
    # Hikari otherwise holds all 80 open per instance even when nothing runs.
    hikari:
      maximum-pool-size: 80
      minimum-idle: 5

  jpa:
    hibernate:
      # Schema is Flyway-owned; Hibernate only validates its entity mapping
      # against what Flyway already migrated — never
      # mutates the schema itself.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    postgresql:
      # The default transaction-scoped migration lock keeps a snapshot open for the whole run, which
      # makes CREATE INDEX CONCURRENTLY wait on Flyway itself forever; a session lock does not.
      transactional-lock: false

  # Bounds Boot's own applicationTaskExecutor, which runs every @Async and
  # @ApplicationModuleListener and the engine's inline steps. Declaring an
  # Executor bean instead would switch this one off. A full queue rejects the
  # task; the claimed step is then closed by the reaper.
  task:
    execution:
      # The trace and the run's baggage follow the after-commit listeners and the outbox.
      propagate-context: true
      thread-name-prefix: app-async-
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 30s
    # Inline-step lease heartbeats share this scheduler with the lease reaper; a second
    # thread keeps a long reaper pass from delaying heartbeats past the lease.
    scheduling:
      pool:
        size: 2

  # Broker connection from SPRING_RABBITMQ_HOST/PORT/USERNAME/PASSWORD (compose sets them; no
  # password default is committed here). A listener that cannot record a message tries 3 times in
  # all, 1 s then 2 s apart, and then the message goes to its dead-letter queue; an invalid message
  # goes there at once. The media listeners start only after the topology is declared.
  rabbitmq:
    # Bounds a hung connect below the 30 s inline heartbeat interval, so no thread is held past one beat.
    connection-timeout: ${SPRING_RABBITMQ_CONNECTION_TIMEOUT:5s}
    # Observed: a sent job carries the W3C trace context, a received result continues it.
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

  # The event publication registry is the outbox for job messages. Outstanding publications are
  # not republished on restart — a job in flight would be dispatched twice; failed ones are resubmitted
  # by the jobs module instead. A completed publication is deleted: the run step is the record.
  modulith:
    events:
      republish-outstanding-events-on-restart: false
      externalization:
        enabled: true
      completion-mode: delete
      staleness:
        published: 5m
        processing: 30m
        resubmitted: 10m

  # Outgoing mail (confirmation and set-password links). Compose points it at the Mailpit
  # sink; a deployment sets its SMTP relay through the same variables. No default host: with email
  # confirmation on, startup fails until one is set (the dev profile uses localhost). Mailpit takes
  # no login; a public relay needs one, sent only after the session has switched to TLS.
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SPRING_MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SPRING_MAIL_SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SPRING_MAIL_SMTP_STARTTLS:false}

server:
  port: 8080
  # The remote address is the client's when nginx (a private-network proxy) sends X-Forwarded-For;
  # Tomcat trusts that header only from private and loopback addresses. The registration limits key on it.
  forward-headers-strategy: native

# Health, info and metrics live on the management port, which compose only exposes inside the
# service network. The API port keeps the anonymous probes /livez and /readyz; the container
# healthchecks use /readyz there, since a probe on another port can be UP while 8080 is broken.
#
# Every request and engine action is traced; the run id travels as baggage across the broker and
# lands in the logs. Spans and log records go out over OTLP only when OTEL_TRACES_EXPORTER /
# OTEL_LOGS_EXPORTER are otlp (Boot maps the OTEL_* variables); without an endpoint nothing is
# exported and trace ids still reach the logs. Metrics are scraped, never pushed.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
        add-additional-paths: true
  # A mail sink outage must not turn the app DOWN: a failed confirmation mail is logged and the
  # member can ask for it again.
  health:
    mail:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields: runId
      correlation:
        fields: runId
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  opentelemetry:
    tracing:
      limits:
        max-attribute-value-length: 4096
    logging:
      limits:
        max-attribute-value-length: 4096

# JDBC observations record the statement, never its parameter values.
jdbc:
  datasource-proxy:
    include-parameter-values: false

# No default here on purpose — a committed real-looking default would trip the
# security-scan secret scanner (Trivy) and ship a known signing key. Only the
# 'dev' profile (application-dev.yml) supplies a fallback; every other
# profile/environment must set JWT_SECRET or JwtKeyConfig fails startup loudly.
flowcortex:
  # Cluster job runner: each pass looks for due jobs every poll-interval; with the runner off the
  # instance registers and runs no scheduled job (the integration suite turns it off).
  jobs:
    poll-interval: ${FLOWCORTEX_JOBS_POLL_INTERVAL:5s}
    runner:
      enabled: ${FLOWCORTEX_JOBS_RUNNER_ENABLED:true}
  # The member app's public origin; links in outgoing mail point here. No default: with email
  # confirmation on, startup fails until it is set (the dev profile uses http://localhost:5173).
  app:
    public-url: ${FLOWCORTEX_APP_PUBLIC_URL:}
  # The one sender of every mail. link-secret (>= 32 bytes) signs unsubscribe links and, together with
  # flowcortex.app.public-url, becomes required once the catalog holds a care or promotional key.
  mail:
    from: ${FLOWCORTEX_MAIL_FROM:no-reply@flow-cortex.dev}
    from-name: ${FLOWCORTEX_MAIL_FROM_NAME:Nodi}
    link-secret: ${FLOWCORTEX_MAIL_LINK_SECRET:}
    links:
      rate-limit:
        capacity: ${FLOWCORTEX_MAIL_LINK_RATE_LIMIT:10}
        period: ${FLOWCORTEX_MAIL_LINK_RATE_WINDOW:60s}
  security:
    jwt-secret: ${JWT_SECRET:}
    # Browser origins allowed to call /api/v1/** cross-origin (comma-separated, never `*` while
    # credentials are allowed). The apps reach the API same-origin through a proxy, so this only
    # matters for a frontend served from another origin.
    cors:
      allowed-origins: ${FLOWCORTEX_CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allow-credentials: ${FLOWCORTEX_CORS_ALLOW_CREDENTIALS:true}
    # Google OAuth 2.0 — an empty client-id leaves the app booting with Google sign-in off
    # (/authorize answers 503); the deployment sets the real values from Google Cloud Console.
    # redirect-uri is the absolute backend callback URL registered at Google; it must be served
    # on the same origin as the app so the flow cookie reaches it. state-ttl bounds one sign-in
    # attempt; the timeouts bound every call to Google.
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/api/v1/auth/oauth/google/callback}
        state-ttl: ${OAUTH_STATE_TTL:10m}
        connect-timeout: ${GOOGLE_CONNECT_TIMEOUT:5s}
        read-timeout: ${GOOGLE_READ_TIMEOUT:10s}
    # Access JWT lifetime; access tokens stay valid until they expire, even after logout.
    # A refresh session ends `ttl` after login (`remember-me-ttl` when remembered) and rotation
    # never extends it. A user keeps at most `max-active-per-user` live sessions; a new login
    # beyond that revokes the oldest.
    jwt:
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:7d}
      remember-me-ttl: ${REFRESH_TOKEN_REMEMBER_ME_TTL:30d}
      max-active-per-user: ${REFRESH_TOKEN_MAX_ACTIVE_PER_USER:10}
  auth:
    # On: a new registration must confirm its email before it can sign in; needs app.public-url and
    # spring.mail.host, or startup fails. Off: accounts are confirmed on creation and register signs
    # the member in. Env var + restart. Unconfirmed accounts older than the retention, with no live
    # link, are deleted every retention interval (below).
    email-confirmation:
      enabled: ${FLOWCORTEX_AUTH_EMAIL_CONFIRMATION_ENABLED:false}
      unconfirmed-account-retention: ${FLOWCORTEX_AUTH_UNCONFIRMED_ACCOUNT_RETENTION:72h}
    # Forgot password: off answers 503 on both reset endpoints. On needs app.public-url and
    # spring.mail.host, or startup fails. A reset link works once, for `validity`. Each client IP
    # and each email (trimmed, lower-cased) gets `capacity` requests per `period`, refilled
    # gradually; over it answers 429 with Retry-After. `submit-per-ip` limits new-password
    # submissions per client IP the same way. Budgets are shared by every backend instance.
    password-reset:
      enabled: ${FLOWCORTEX_AUTH_PASSWORD_RESET_ENABLED:false}
      validity: ${FLOWCORTEX_AUTH_PASSWORD_RESET_VALIDITY:1h}
      per-ip:
        capacity: ${FLOWCORTEX_AUTH_PASSWORD_RESET_PER_IP_CAPACITY:5}
        period: ${FLOWCORTEX_AUTH_PASSWORD_RESET_PER_IP_PERIOD:1h}
      per-email:
        capacity: ${FLOWCORTEX_AUTH_PASSWORD_RESET_PER_EMAIL_CAPACITY:3}
        period: ${FLOWCORTEX_AUTH_PASSWORD_RESET_PER_EMAIL_PERIOD:1h}
      submit-per-ip:
        capacity: ${FLOWCORTEX_AUTH_PASSWORD_RESET_SUBMIT_PER_IP_CAPACITY:10}
        period: ${FLOWCORTEX_AUTH_PASSWORD_RESET_SUBMIT_PER_IP_PERIOD:1h}
    # Step-up: each signed-in user gets `capacity` password attempts per `period` at
    # POST /api/v1/me/step-up, every attempt counted; over it answers 429 with Retry-After before the
    # password is compared. Shared by every backend instance through the rate-limit registry.
    step-up:
      per-user:
        capacity: ${FLOWCORTEX_AUTH_STEP_UP_PER_USER_CAPACITY:5}
        period: ${FLOWCORTEX_AUTH_STEP_UP_PER_USER_PERIOD:1m}
    # Personal access tokens (fc_pat_...) for scripted API calls by admin accounts. Off answers 503 on
    # the /api/v1/me/api-tokens routes and 401 to any fc_pat_ bearer; rows are kept. Each token value
    # gets `per-minute` and `per-day` requests, counted before authentication; over either answers 429
    # with Retry-After. A user holds at most `max-live-per-user` live tokens. Limits are registry
    # limiters, shared by every backend instance. Env var + restart.
    personal-access-tokens:
      enabled: ${FLOWCORTEX_AUTH_PERSONAL_ACCESS_TOKENS_ENABLED:false}
      max-live-per-user: ${FLOWCORTEX_AUTH_PERSONAL_ACCESS_TOKENS_MAX_LIVE_PER_USER:10}
      default-lifetime: ${FLOWCORTEX_AUTH_PERSONAL_ACCESS_TOKENS_DEFAULT_LIFETIME:90d}
      per-minute:
        capacity: ${FLOWCORTEX_AUTH_PERSONAL_ACCESS_TOKENS_PER_MINUTE_CAPACITY:60}
        period: ${FLOWCORTEX_AUTH_PERSONAL_ACCESS_TOKENS_PER_MINUTE_PERIOD:1m}
      per-day:
        capacity: ${FLOWCORTEX_AUTH_PERSONAL_ACCESS_TOKENS_PER_DAY_CAPACITY:1000}
        period: ${FLOWCORTEX_AUTH_PERSONAL_ACCESS_TOKENS_PER_DAY_PERIOD:1d}
    # MCP authorization server (OAuth 2.1 code + PKCE) that hands an MCP client a personal access token
    # after an admin consents in the member app. Off answers 503 on every /api/v1/oauth route and the
    # /.well-known/oauth-authorization-server metadata; on needs personal-access-tokens.enabled and
    # flowcortex.app.public-url (the issuer), or startup fails. Registration and token/revoke requests
    # are limited per client IP (`register-per-ip`, `token-per-ip`; 429 with Retry-After), shared by
    # every backend instance. `retention-interval` is how often spent codes and unused clients are
    # purged. Env var + restart.
    mcp-oauth:
      enabled: ${FLOWCORTEX_AUTH_MCP_OAUTH_ENABLED:false}
      register-per-ip:
        capacity: ${FLOWCORTEX_AUTH_MCP_OAUTH_REGISTER_PER_IP_CAPACITY:10}
        period: ${FLOWCORTEX_AUTH_MCP_OAUTH_REGISTER_PER_IP_PERIOD:1h}
      token-per-ip:
        capacity: ${FLOWCORTEX_AUTH_MCP_OAUTH_TOKEN_PER_IP_CAPACITY:30}
        period: ${FLOWCORTEX_AUTH_MCP_OAUTH_TOKEN_PER_IP_PERIOD:1m}
      retention-interval: ${FLOWCORTEX_AUTH_MCP_OAUTH_RETENTION_INTERVAL:1h}
    # Every write (POST/PUT/PATCH/DELETE) made with a personal access token leaves one audit row (route,
    # outcome, status, no query or body). `daily-write-limit` caps an owner's token writes per UTC day and
    # `daily-workflow-create-limit` caps their workflow creations; 0 is off, a negative value stops
    # startup, and the counts are soft under concurrency. A POST or PATCH with an `Idempotency-Key` runs
    # once per owner and key for `idempotency-window` and its 2xx answer (up to `max-stored-response-body`)
    # is replayed to retries; a request body over `max-keyed-request-body` or multipart is refused with a
    # key; a reservation older than `idempotency-stale-after` is taken over. `retention` is how long
    # call rows are kept. Env var + restart.
    api-token-calls:
      daily-write-limit: ${FLOWCORTEX_AUTH_API_TOKEN_CALLS_DAILY_WRITE_LIMIT:0}
      daily-workflow-create-limit: ${FLOWCORTEX_AUTH_API_TOKEN_CALLS_DAILY_WORKFLOW_CREATE_LIMIT:0}
      retention: ${FLOWCORTEX_AUTH_API_TOKEN_CALLS_RETENTION:90d}
      idempotency-window: ${FLOWCORTEX_AUTH_API_TOKEN_CALLS_IDEMPOTENCY_WINDOW:24h}
      idempotency-stale-after: ${FLOWCORTEX_AUTH_API_TOKEN_CALLS_IDEMPOTENCY_STALE_AFTER:5m}
      max-keyed-request-body: ${FLOWCORTEX_AUTH_API_TOKEN_CALLS_MAX_KEYED_REQUEST_BODY:1MB}
      max-stored-response-body: ${FLOWCORTEX_AUTH_API_TOKEN_CALLS_MAX_STORED_RESPONSE_BODY:256KB}
    # A scheduled job deletes auth_event rows (they hold IPs and user agents) older than
    # `audit-events`, refresh-token rows that expired or were revoked, reset-link rows that were
    # used or expired, spent step-up proofs, and revoked access tokens or ones expired longer ago
    # than `audit-events`, every `interval`.
    retention:
      interval: ${FLOWCORTEX_AUTH_RETENTION_INTERVAL:1h}
      audit-events: ${FLOWCORTEX_AUTH_AUDIT_RETENTION:90d}
  # Admin audit rows are kept; only their client address and user agent are cleared after
  # `origin-retention`, checked every `retention-interval`.
  admin-audit:
    origin-retention: ${FLOWCORTEX_ADMIN_AUDIT_ORIGIN_RETENTION:365d}
    retention-interval: ${FLOWCORTEX_ADMIN_AUDIT_RETENTION_INTERVAL:1h}
  # Deleted trend templates are purged after `grace`, a pass taking at most `batch-size` of them.
  # Grace must stay above the longest media URL lifetime plus the longest run that reads template media.
  trend:
    purge:
      interval: ${FLOWCORTEX_TREND_PURGE_INTERVAL:15m}
      grace: ${FLOWCORTEX_TREND_PURGE_GRACE:8d}
      batch-size: ${FLOWCORTEX_TREND_PURGE_BATCH_SIZE:20}
  # Password login throttle: each client IP gets `capacity` failed attempts per `period`, refilled
  # gradually; over it answers 429 with Retry-After before the password is checked. Budgets are
  # shared by every backend instance. The per-account lockout (5 failures, 15 minutes) is separate.
  login:
    failures-per-ip:
      capacity: ${FLOWCORTEX_LOGIN_FAILURES_PER_IP_CAPACITY:20}
      period: ${FLOWCORTEX_LOGIN_FAILURES_PER_IP_PERIOD:15m}
  # Public intake for errors the web apps contain (POST /api/v1/client-errors, no token needed).
  # Off answers 204 to everything without reading, limiting, logging or counting. Each client
  # address gets `capacity` reports per `period`; over it answers 429 with Retry-After. Env var + restart.
  client-errors:
    enabled: ${FLOWCORTEX_CLIENT_ERRORS_ENABLED:true}
    per-ip:
      capacity: ${FLOWCORTEX_CLIENT_ERRORS_PER_IP_CAPACITY:10}
      period: ${FLOWCORTEX_CLIENT_ERRORS_PER_IP_PERIOD:1m}
  # Rate-limit budgets live in the database (table rate_limit_bucket) so every backend instance
  # shares them. The store has its own small connection pool: a stalled store admits the request
  # after `connection-timeout`, `lock-timeout` or `statement-timeout` instead of holding it. Full buckets are swept
  # every `sweep-interval`.
  rate-limit:
    sweep-interval: ${FLOWCORTEX_RATE_LIMIT_SWEEP_INTERVAL:PT10M}
    store:
      max-pool-size: ${FLOWCORTEX_RATE_LIMIT_STORE_MAX_POOL_SIZE:8}
      connection-timeout: ${FLOWCORTEX_RATE_LIMIT_STORE_CONNECTION_TIMEOUT:250ms}
      lock-timeout: ${FLOWCORTEX_RATE_LIMIT_STORE_LOCK_TIMEOUT:200ms}
      statement-timeout: ${FLOWCORTEX_RATE_LIMIT_STORE_STATEMENT_TIMEOUT:500ms}
  # Kill switch for the admin console's API (/api/v1/admin/**): off answers 503 there, after the
  # role checks; /api/v1/users is not affected. Env var + restart, like the workflow one below.
  admin:
    enabled: ${FLOWCORTEX_ADMIN_ENABLED:true}
  authz:
    rbac-mutations:
      # false forces role and permission edits off; unset lets the super admin decide
      enabled: ${FLOWCORTEX_AUTHZ_RBAC_MUTATIONS_ENABLED:}
  # Public self-registration. Accounts belong to the ADMIN named here, who lists and suspends them
  # under /api/v1/users; empty, unknown, not an ADMIN or not ACTIVE closes registration (403).
  # Each client IP and each email (trimmed, lower-cased) gets `capacity` attempts per `period`,
  # refilled gradually; over it answers 429 with Retry-After. Budgets are shared by every backend instance.
  registration:
    owner-email: ${FLOWCORTEX_REGISTRATION_OWNER_EMAIL:}
    per-ip:
      capacity: ${FLOWCORTEX_REGISTRATION_PER_IP_CAPACITY:5}
      period: ${FLOWCORTEX_REGISTRATION_PER_IP_PERIOD:1h}
    per-email:
      capacity: ${FLOWCORTEX_REGISTRATION_PER_EMAIL_CAPACITY:3}
      period: ${FLOWCORTEX_REGISTRATION_PER_EMAIL_PERIOD:1h}
  # Users CSV export (GET /api/v1/users/export): a filter matching more accounts than this is refused
  # with 422 instead of producing a partial file. The file is built in memory, so raising it raises heap use.
  users:
    export:
      max-rows: ${FLOWCORTEX_USERS_EXPORT_MAX_ROWS:10000}
  # Phone verification by one-time code (/api/v1/me/phone/**): off answers 503 there. On needs an
  # SMS sender (flowcortex.sms.sender below), or startup fails.
  phone-verification:
    enabled: ${FLOWCORTEX_PHONE_VERIFICATION_ENABLED:false}
    # Send-code quotas, over the last 24 h unless noted; each refusal answers 429 with Retry-After.
    # A member's sends and distinct numbers count "number already verified" answers too. The
    # per-IP budget is shared by every backend instance; the rest are read from the database.
    limits:
      allowed-country-codes: ${FLOWCORTEX_PHONE_ALLOWED_COUNTRY_CODES:84}
      user-sends-per-day: ${FLOWCORTEX_PHONE_USER_SENDS_PER_DAY:10}
      user-numbers-per-day: ${FLOWCORTEX_PHONE_USER_NUMBERS_PER_DAY:3}
      per-ip:
        capacity: ${FLOWCORTEX_PHONE_PER_IP_CAPACITY:30}
        period: ${FLOWCORTEX_PHONE_PER_IP_PERIOD:1h}
      number-sends-per-day: ${FLOWCORTEX_PHONE_NUMBER_SENDS_PER_DAY:20}
      global-sends-per-day: ${FLOWCORTEX_PHONE_GLOBAL_SENDS_PER_DAY:2000}
    # A scheduled job deletes send attempts (they hold IPs) and outbox messages older than these.
    retention:
      interval: ${FLOWCORTEX_PHONE_RETENTION_INTERVAL:1h}
      send-attempts: ${FLOWCORTEX_PHONE_SEND_ATTEMPT_RETENTION:30d}
      sms-outbox: ${FLOWCORTEX_SMS_OUTBOX_RETENTION:7d}
  # The phone wall: on refuses a signed-in member's requests until a phone number is verified
  # (staff and super admins excepted). Needs phone verification on, or startup fails; env + restart.
  phone-gate:
    enabled: ${FLOWCORTEX_PHONE_GATE_ENABLED:false}
  # HMAC key for phone_send_attempt.phone_hash; at least 32 bytes when phone verification is on.
  phone:
    hash-secret: ${FLOWCORTEX_PHONE_HASH_SECRET:}
  # A missing or invalid keyring stops startup; each key is 32 random bytes in base64, set as FLOWCORTEX_CONNECTORS_ENCRYPTION_KEYS_<ID>.
  connectors:
    encryption:
      current: ${FLOWCORTEX_CONNECTORS_ENCRYPTION_CURRENT:}
    # Off means every Telegram route and send answers 503 and no request leaves for Telegram.
    # api.telegram.org must also be on the egress proxy's allowlist.
    telegram:
      enabled: ${FLOWCORTEX_CONNECTORS_TELEGRAM_ENABLED:false}
      api-base-url: https://api.telegram.org
      read-timeout: 8s
      send-timeout: 15s
  # Where SMS go. Empty: nowhere. "outbox": the sms_outbox table, read in the admin console
  # (/api/v1/admin/sms-outbox exists only then); development stacks only, nothing is delivered.
  sms:
    sender: ${FLOWCORTEX_SMS_SENDER:}
    # "vietguys" selects the VietGuys SMS Brandname sender below and refuses startup unless the
    # username, brandname, refresh-token seed, keyring and all three templates are set. The templates
    # must match the texts registered for the brandname; the carrier refuses any other text. Both
    # URLs leave through the egress proxy, which must allow their hosts.
    vietguys:
      sms-url: ${FLOWCORTEX_VIETGUYS_SMS_URL:https://cloudsms4.vietguys.biz:4438/api/index.php}
      token-url: ${FLOWCORTEX_VIETGUYS_TOKEN_URL:https://api-v2.vietguys.biz:4438/token/v1/refresh}
      username: ${FLOWCORTEX_VIETGUYS_SMS_USERNAME:}
      brandname: ${FLOWCORTEX_VIETGUYS_SMS_BRANDNAME:}
      refresh-token: ${FLOWCORTEX_VIETGUYS_SMS_REFRESH_TOKEN:}
      # Keyring for the stored tokens: base64 of 32 random bytes per key id. k2 is the rotation slot.
      keys:
        k1: ${FLOWCORTEX_SMS_CREDENTIAL_KEYS_K1:}
        k2: ${FLOWCORTEX_SMS_CREDENTIAL_KEYS_K2:}
      current-key-id: ${FLOWCORTEX_SMS_CREDENTIAL_CURRENT_KEY_ID:k1}
      templates:
        otp: ${FLOWCORTEX_VIETGUYS_TEMPLATE_OTP:}
        phone-changed: ${FLOWCORTEX_VIETGUYS_TEMPLATE_PHONE_CHANGED:}
        phone-change-reverted: ${FLOWCORTEX_VIETGUYS_TEMPLATE_PHONE_CHANGE_REVERTED:}
      connect-timeout: 5s
      read-timeout: 10s
  # Personal spaces: off means the session space answers 503; spaces are still provisioned at activation.
  spaces:
    enabled: ${FLOWCORTEX_SPACES_ENABLED:false}
  # Trash: off means the routes answer 503 and the sweep and reminder passes do nothing; recording still works.
  # An entry is purged retention after its delete; the reminder goes out reminder-lead before that.
  trash:
    enabled: ${FLOWCORTEX_TRASH_ENABLED:false}
    retention: P30D
    reminder-lead: P3D
    sweep-interval: PT1H
    reminder-interval: PT1H
  # Uploaded Drive files never expire, so each personal space is capped (run-output items add no storage).
  drive:
    max-bytes-per-space: ${FLOWCORTEX_DRIVE_MAX_BYTES_PER_SPACE:5368709120}
    max-items-per-space: ${FLOWCORTEX_DRIVE_MAX_ITEMS_PER_SPACE:1000}
  # Member onboarding journey: off means no entry is offered and progress writes answer 409; the quiz routes keep working.
  onboarding:
    enabled: ${FLOWCORTEX_ONBOARDING_ENABLED:false}
  # Run credits: off means no balance check at start, no debit or refund, no balance shown.
  # Prices live in the rate_card and capability_pricing tables, not here. Every registered step type
  # needs a capability_pricing row and an active rate_card row, or startup fails. To change a price,
  # in one migration: UPDATE the key's open rate_card row SET effective_to = T, then INSERT the new
  # open-ended row with effective_from = T.
  credits:
    enabled: ${FLOWCORTEX_CREDITS_ENABLED:false}
  # Payments region gate: off places nobody, shadow only counts callers outside Vietnam,
  # enforce refuses them on payment-opening handlers. The mode is the configured layer of the console
  # setting payment.region_gate.mode: a value stored there wins. The refresh pace is for the registry download.
  billing:
    region-gate:
      mode: ${FLOWCORTEX_BILLING_REGION_GATE_MODE:shadow}
      refresh-interval: ${FLOWCORTEX_BILLING_REGION_GATE_REFRESH_INTERVAL:PT24H}
      refresh-initial-delay: ${FLOWCORTEX_BILLING_REGION_GATE_REFRESH_INITIAL_DELAY:PT10M}
    # MoMo: off until the merchant contract is signed. Enabling it fails startup on a missing credential or URL,
    # a callback URL off the receiver route, or an empty or unreadable source allowlist.
    momo:
      enabled: ${FLOWCORTEX_BILLING_MOMO_ENABLED:false}
      base-url: ${FLOWCORTEX_BILLING_MOMO_BASE_URL:https://test-payment.momo.vn}
      partner-code: ${FLOWCORTEX_BILLING_MOMO_PARTNER_CODE:}
      access-key: ${FLOWCORTEX_BILLING_MOMO_ACCESS_KEY:}
      secret-key: ${FLOWCORTEX_BILLING_MOMO_SECRET_KEY:}
      redirect-url: ${FLOWCORTEX_BILLING_MOMO_REDIRECT_URL:}
      ipn-url: ${FLOWCORTEX_BILLING_MOMO_IPN_URL:}
      offered-instruments: ${FLOWCORTEX_BILLING_MOMO_OFFERED_INSTRUMENTS:wallet}
      callback-source-allowlist: ${FLOWCORTEX_BILLING_MOMO_CALLBACK_SOURCE_ALLOWLIST:}
      circuit:
        enabled: ${FLOWCORTEX_BILLING_MOMO_CIRCUIT_ENABLED:true}
        failure-threshold: ${FLOWCORTEX_BILLING_MOMO_CIRCUIT_FAILURE_THRESHOLD:5}
        open-duration: ${FLOWCORTEX_BILLING_MOMO_CIRCUIT_OPEN_DURATION:PT30S}
    # Applies accepted provider callbacks to payments; switched off, callbacks wait unapplied.
    ledger:
      apply:
        enabled: ${FLOWCORTEX_BILLING_LEDGER_APPLY_ENABLED:true}
        interval: ${FLOWCORTEX_BILLING_LEDGER_APPLY_INTERVAL:PT5S}
        batch-size: ${FLOWCORTEX_BILLING_LEDGER_APPLY_BATCH_SIZE:100}
  # SSE (/api/v1/realtime/stream). Replay ring and max-streams-per-user are per instance;
  # queue-max-length drops the oldest broker event; a full publish queue drops with a WARN.
  # hub-threads are the module's own, not Boot's pools.
  realtime:
    heartbeat: 15s
    recheck-interval: 60s
    replay:
      max-events: 1000
      max-age: 120s
    max-streams-per-user: 5
    max-topics-per-stream: 8
    queue-max-length: 10000
    hub-threads: 2
    publish:
      queue-capacity: 1000
  # In-app notifications: a member keeps their newest max-per-member; older ones are deleted on insert.
  notifications:
    max-per-member: 500
  # Kill switch gating POST
  # /api/v1/workflows/{id}/runs — off means new runs are refused (503), but
  # already-started/finished runs stay readable. Flip via the
  # FLOWCORTEX_WORKFLOW_ENABLED env var + a process restart (no new flag
  # library, no runtime toggle endpoint) — a plain config property, not a
  # DB-backed live toggle.
  workflow:
    enabled: ${FLOWCORTEX_WORKFLOW_ENABLED:true}
    # Member-initiated run cancellation: off answers 503 and the app hides the stop button.
    cancel:
      enabled: ${FLOWCORTEX_WORKFLOW_CANCEL_ENABLED:false}
    # A picked-up step must report within this window (a heartbeat every 30 s)
    # or the reaper closes it as lease_expired; the reaper runs every interval.
    lease-seconds: 120
    reaper-interval-ms: 30000
    # The pass that refreshes the Explore trending and popular figures runs once per interval.
    discovery:
      stats-interval-ms: ${FLOWCORTEX_WORKFLOW_DISCOVERY_STATS_INTERVAL_MS:600000}
      # A workflow joins another's similar list only when at least this many other members ran both, so no
      # listed workflow can be traced back to fewer members. Below 1 is read as 1. Env var + restart.
      similar-min-support: ${FLOWCORTEX_WORKFLOW_DISCOVERY_SIMILAR_MIN_SUPPORT:3}
    # A review nobody decided within expire-after ends as `expired` and stops its run (REVIEW_EXPIRED);
    # the sweep looks every sweep-interval-ms. Env var + restart.
    review:
      expire-after: ${FLOWCORTEX_REVIEW_EXPIRE_AFTER:7d}
      sweep-interval-ms: 60000
    qa-review:
      # ON SENDS RUN CONTENT TO GEMINI: the step's instruction, the run input and the reviewed content
      # (each cut to 8000 characters, no names or ids) leave for the provider to write the questions.
      # Off: every QA review asks the standard questions. Env var + restart.
      ai-questions:
        enabled: ${FLOWCORTEX_QA_REVIEW_AI_QUESTIONS_ENABLED:false}
      # A task still waiting for its questions this long after it opened gets the standard ones.
      generating-timeout: 2m
      # The model call runs on its own threads so it never starves the shared async pool. `size` run
      # at once, `queue-capacity` wait; a task arriving with both full gets the standard questions at
      # once.
      pool:
        size: 2
        queue-capacity: 50
    share:
      # HMAC key for anonymous access-log dedupe; at least 32 bytes, startup fails without it.
      accessor-hash-secret: ${FLOWCORTEX_WORKFLOW_SHARE_HASH_SECRET:}
      # GET /api/v1/workflows/by-key/{key} without a token: each client address gets `capacity`
      # reads per `period`, refilled gradually; over it answers 429 with Retry-After. A signed-in
      # reader is not counted. Budgets are shared by every backend instance. Env var + restart.
      rate-limit:
        capacity: ${FLOWCORTEX_WORKFLOW_SHARE_RATE_LIMIT_CAPACITY:30}
        period: ${FLOWCORTEX_WORKFLOW_SHARE_RATE_LIMIT_PERIOD:1m}
    call:
      # Longest a workflow.call step waits for its child run; past it the step fails run_timeout and the
      # child is stopped. Covers a child of four media steps at their queue and run bounds.
      max-runtime: ${FLOWCORTEX_WORKFLOW_CALL_MAX_RUNTIME:2h}
    iterate:
      # Most items of a provider-pool type (translate, tts) one iterate step runs at once, whatever its
      # `concurrency`. Those items share flowcortex.dub.pool with every member's dub steps, and an item the
      # full pool rejects fails provider_busy; 1 loads the pool no more than a single top-level step does.
      # From 1 to flowcortex.dub.pool.size.
      provider-concurrency: ${FLOWCORTEX_WORKFLOW_ITERATE_PROVIDER_CONCURRENCY:1}
    # How often reviews of an uploaded workflow file that were never imported are deleted.
    import-review:
      purge-interval: ${FLOWCORTEX_WORKFLOW_IMPORT_REVIEW_PURGE_INTERVAL:PT15M}
  # Paid video-clip vendor jobs are recorded when the vendor accepts them, so a repeated identical
  # ask picks the job up instead of paying again. resume-enabled off sends no attach candidates
  # (every clip submits) while recording continues. Rows older than `retention` are deleted every
  # cleanup interval. Env var + restart.
  vendor-jobs:
    resume-enabled: ${FLOWCORTEX_VENDOR_JOBS_RESUME_ENABLED:true}
    cleanup:
      enabled: ${FLOWCORTEX_VENDOR_JOBS_CLEANUP_ENABLED:true}
      interval: ${FLOWCORTEX_VENDOR_JOBS_CLEANUP_INTERVAL:1h}
    retention: ${FLOWCORTEX_VENDOR_JOBS_RETENTION:7d}
  # Vietnamese dubbing: the translate and tts steps call Gemini. Off by default; the steps count as
  # available only with the switch on AND a key — otherwise a dub run is refused (503 dub_disabled)
  # and a run already past its start fails dub_disabled at its next dub step. Env var + restart,
  # like the switches above. The key is never logged. The models, retries and timeouts live in
  # flowcortex.llm.gemini.slots (dub-translate, dub-speech).
  dub:
    enabled: ${FLOWCORTEX_DUB_ENABLED:false}
    # How fast a voice reads Vietnamese: a line may have floor(rate x slot seconds) characters.
    chars-per-second: 13
    # An unedited line expected to take longer than this multiple of its slot is reworded first.
    shorten-above: 1.2
    voices:
      female: Kore
      male: Charon
    # The translate and tts steps hold a thread for as long as the provider takes (up to minutes
    # in an outage), so they run on their own threads and never starve the shared async pool.
    # `size` run at once, `queue-capacity` wait; a step arriving with both full fails
    # provider_busy at once, and a waiting step's queue deadline covers the rounds ahead of it.
    pool:
      size: 4
      queue-capacity: 4
  # Registering a run's assets makes object-store calls, so it runs on its own threads and never
  # holds the shared async pool that advances runs; a hand-off finding both full waits for the sweep.
  asset:
    registration:
      sweep-interval: 120s
      pool:
        size: 2
        queue-capacity: 20
  # Product Video is opt-in outside development. Turning it off blocks only new
  # Product Video runs; existing runs remain readable and continue advancing.
  product-video:
    enabled: ${FLOWCORTEX_PRODUCT_VIDEO_ENABLED:false}
    parallel-clips-enabled: ${PRODUCT_VIDEO_PARALLEL_CLIPS_ENABLED:false}
  # Hosted language model (Gemini API). An empty api-key still boots; every model call then fails
  # and logs a config error. read-timeout bounds each request; answer-timeout bounds one whole
  # answer.
  llm:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
      read-timeout: ${GEMINI_READ_TIMEOUT:20s}
      answer-timeout: ${GEMINI_ANSWER_TIMEOUT:20s}
      # Content-safety threshold sent with every slot JSON call: BLOCK_LOW_AND_ABOVE,
      # BLOCK_MEDIUM_AND_ABOVE, BLOCK_ONLY_HIGH, BLOCK_NONE or OFF. A slot's own value overrides it.
      safety-threshold: ${GEMINI_SAFETY_THRESHOLD:BLOCK_MEDIUM_AND_ABOVE}
      # Model chains by purpose. Per model: attempts, the waits between them and how long one call
      # may take; the models are tried in order, the later one is the fallback. The dub steps' max
      # run times are derived from these. A model switched off in the admin registry is skipped.
      slots:
        dub-translate:
          models: gemini-3.5-flash-lite,gemini-3.8-flash
          attempts: 3
          retry-waits: 10s,30s
          call-timeout: 60s
          # Quoted: unquoted off/OFF load as the boolean false.
          thinking: "off"
          # Mature dialogue in a member's film must not end a paid dub run.
          safety-threshold: "OFF"
        # The Help Center assistant: one attempt per model so both fit the 20s answer-timeout.
        support-assistant:
          models: ${FLOWCORTEX_SUPPORT_ASSISTANT_MODEL:gemini-3.5-flash-lite,gemini-3.8-flash}
          attempts: 1
          retry-waits:
          call-timeout: 9s
          thinking: "off"
        dub-speech:
          models: gemini-3.8-flash-tts,gemini-3.8-flash-lite-tts
          attempts: 3
          retry-waits: 10s,30s
          call-timeout: 60s
        # Questions for a QA review; its worst case (about 42 s) stays under qa-review.generating-timeout.
        qa-questions:
          models: gemini-3.5-flash-lite
          attempts: 2
          retry-waits: 2s
          call-timeout: 20s
  # Help Center. Off: no help button, member and guest support routes answer 503 (admin routes stay
  # up). The assistant switch and the four daily limits below are configured here and changed at
  # runtime in the console Settings page; FLOWCORTEX_SUPPORT_ASSISTANT_ENABLED=false keeps the
  # assistant off whatever is stored. The Help Center switch itself needs a restart.
  support:
    enabled: ${FLOWCORTEX_SUPPORT_ENABLED:false}
    # Shown to guests and suspended members; empty shows no contact line.
    contact-email: ${FLOWCORTEX_SUPPORT_CONTACT_EMAIL:}
    assistant:
      enabled: ${FLOWCORTEX_SUPPORT_ASSISTANT_ENABLED:false}
      # HMAC key for guest session ids and network addresses; at least 32 bytes while the assistant is on.
      hash-secret: ${FLOWCORTEX_SUPPORT_HASH_SECRET:}
      # Questions per day over everyone; reaching it pauses the assistant until 00:00 Asia/Ho_Chi_Minh.
      daily-ceiling: ${FLOWCORTEX_SUPPORT_ASSISTANT_DAILY_CEILING:2000}
      member-daily-quota: ${FLOWCORTEX_SUPPORT_MEMBER_DAILY_QUOTA:50}
      guest-daily-quota: ${FLOWCORTEX_SUPPORT_GUEST_DAILY_QUOTA:10}
      guest-network-daily-quota: ${FLOWCORTEX_SUPPORT_GUEST_NETWORK_DAILY_QUOTA:100}
    # Request lifecycle: the three switches and three numbers below are configured here and changed at
    # runtime in the console Settings page; a switch set to false here stays off whatever is stored.
    lifecycle:
      auto-close-enabled: ${FLOWCORTEX_SUPPORT_AUTO_CLOSE_ENABLED:true}
      # Days after the member first opens a resolution before it closes (1-90).
      auto-close-resolved-days: ${FLOWCORTEX_SUPPORT_AUTO_CLOSE_RESOLVED_DAYS:7}
      reply-mail-enabled: ${FLOWCORTEX_SUPPORT_REPLY_MAIL_ENABLED:true}
      # Minutes replies to one request are gathered into a single mail; 0 mails after the next sweep (0-1440).
      reply-mail-window-minutes: ${FLOWCORTEX_SUPPORT_REPLY_MAIL_WINDOW_MINUTES:0}
      retention-enabled: ${FLOWCORTEX_SUPPORT_RETENTION_ENABLED:true}
      # Months a closed request is kept after its last activity (6-120).
      retention-closed-request-months: ${FLOWCORTEX_SUPPORT_RETENTION_CLOSED_REQUEST_MONTHS:24}
    # Response deadline of an admin inbox request: the alert switch and four numbers below are configured
    # here and changed at runtime in the console Settings page; alerts set to false here stay off whatever
    # is stored. A warning must be below its limit or startup fails.
    sla:
      alerts-enabled: ${FLOWCORTEX_SUPPORT_SLA_ALERTS_ENABLED:true}
      # Hours a new request may wait for a first response before it is overdue (1-720).
      new-hours: ${FLOWCORTEX_SUPPORT_SLA_NEW_HOURS:24}
      # Hours of waiting after which a new request is due soon; below new-hours (1-720).
      new-warn-hours: ${FLOWCORTEX_SUPPORT_SLA_NEW_WARN_HOURS:20}
      # Days an in-progress request may sit without activity before it is overdue (1-90).
      in-progress-days: ${FLOWCORTEX_SUPPORT_SLA_IN_PROGRESS_DAYS:3}
      # Days of inactivity after which an in-progress request is due soon; below in-progress-days (1-90).
      in-progress-warn-days: ${FLOWCORTEX_SUPPORT_SLA_IN_PROGRESS_WARN_DAYS:2}
      # Pace of the sweep that raises the due-soon and overdue alerts.
      sweep-interval: PT5M
    # Pace of the reply-mail sweep and the closed-request purge; not under support.retention, whose
    # interval paces the auto-close and assistant retention jobs.
    reply-mail:
      sweep-interval: PT1M
    request-retention:
      interval: PT6H
  # Main chat. Off: the page is hidden by the features flag. The console's chat switch gates sends on top
  # of it. Restart to apply. Limits count member messages; the sweeper fails a turn still running
  # sweep-grace after turn-timeout.
  chat:
    enabled: ${FLOWCORTEX_CHAT_ENABLED:false}
    model: ${FLOWCORTEX_CHAT_MODEL:gemini-3.5-flash}
    quota:
      member-per-day: ${FLOWCORTEX_CHAT_MEMBER_DAILY_QUOTA:100}
      global-per-day: ${FLOWCORTEX_CHAT_GLOBAL_DAILY_QUOTA:5000}
      per-minute: ${FLOWCORTEX_CHAT_PER_MINUTE:10}
    turn-timeout: ${FLOWCORTEX_CHAT_TURN_TIMEOUT:90s}
    sweep-grace: ${FLOWCORTEX_CHAT_SWEEP_GRACE:30s}
    max-tool-rounds: ${FLOWCORTEX_CHAT_MAX_TOOL_ROUNDS:4}
    turn-threads: ${FLOWCORTEX_CHAT_TURN_THREADS:8}
    turn-queue: ${FLOWCORTEX_CHAT_TURN_QUEUE:32}
    # One answer's token cap. The provider counts the model's thinking tokens inside it, so the thinking
    # budget is the share thinking may use and must stay below it.
    max-output-tokens: ${FLOWCORTEX_CHAT_MAX_OUTPUT_TOKENS:8192}
    thinking-budget: ${FLOWCORTEX_CHAT_THINKING_BUDGET:1024}
    # Conversation history. max-folders is the most folders one member holds; the sidebar reads them all.
    history:
      max-folders: ${FLOWCORTEX_CHAT_MAX_FOLDERS:100}
  # Media engine: the one home of every media timeout and limit (MediaProperties
  # has no code defaults). The kill switch works like the workflow one above —
  # env var + restart. S3_* is provider-neutral, so another S3-compatible store
  # is a configuration change; each service gets its own least-privilege key.
  media:
    enabled: ${FLOWCORTEX_MEDIA_ENABLED:true}
    # How long a dispatched job may wait for a worker to pick it up.
    queue-timeout: ${FLOWCORTEX_MEDIA_QUEUE_TIMEOUT:30m}
    max-runtime:
      probe: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_PROBE:5m}
      extract_audio: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_EXTRACT_AUDIO:10m}
      align_audio: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_ALIGN_AUDIO:10m}
      render_video: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_RENDER_VIDEO:5m}
      separate_audio: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_SEPARATE_AUDIO:15m}
      fetch_video: ${FLOWCORTEX_MEDIA_MAX_RUNTIME_FETCH_VIDEO:10m}
    # The broker's per-delivery ack deadline; must outlast every max run time.
    consumer-timeout: ${FLOWCORTEX_MEDIA_CONSUMER_TIMEOUT:20m}
    # The provider runtime runs on the same ack deadline, so its ceilings are checked against
    # consumer-timeout too. Both are queue arguments fixed once the queue exists: changing
    # consumer-timeout needs provider.jobs and provider.video.jobs deleted (LOCAL_SETUP.md §3).
    # Script, storyboard and speech jobs (provider.jobs):
    provider-max-runtime: ${FLOWCORTEX_MEDIA_PROVIDER_MAX_RUNTIME:2m}
    provider-queue-timeout: ${FLOWCORTEX_MEDIA_PROVIDER_QUEUE_TIMEOUT:5m}
    # Video clips (provider.video.jobs): a clip polls its vendor for up to 8 minutes, and a third
    # concurrent clip waits for one of the two video workers to finish.
    provider-video-max-runtime: ${FLOWCORTEX_MEDIA_PROVIDER_VIDEO_MAX_RUNTIME:10m}
    provider-video-queue-timeout: ${FLOWCORTEX_MEDIA_PROVIDER_VIDEO_QUEUE_TIMEOUT:15m}
    presign-ttl: 15m
    # Video editor limits (EditorLimitProperties). An admin value from the console Settings page
    # overrides these; a value outside its bounds fails startup naming the key.
    editor:
      project-max-versions: ${FLOWCORTEX_MEDIA_EDITOR_PROJECT_MAX_VERSIONS:50}
      project-max-bytes: ${FLOWCORTEX_MEDIA_EDITOR_PROJECT_MAX_BYTES:2000000}
      batch-max-items: ${FLOWCORTEX_MEDIA_EDITOR_BATCH_MAX_ITEMS:4}
      take-check-daily-max: ${FLOWCORTEX_MEDIA_EDITOR_TAKE_CHECK_DAILY_MAX:14}
      stems-max-duration-sec: ${FLOWCORTEX_MEDIA_EDITOR_STEMS_MAX_DURATION_SEC:600}
      speakers-max-duration-sec: ${FLOWCORTEX_MEDIA_EDITOR_SPEAKERS_MAX_DURATION_SEC:600}
      derive-max-duration-sec: ${FLOWCORTEX_MEDIA_EDITOR_DERIVE_MAX_DURATION_SEC:600}
      beats-max-duration-sec: ${FLOWCORTEX_MEDIA_EDITOR_BEATS_MAX_DURATION_SEC:600}
      audio-tools-max-duration-sec: ${FLOWCORTEX_MEDIA_EDITOR_AUDIO_TOOLS_MAX_DURATION_SEC:3600}
    upload:
      # Per-kind size caps; the kind comes from the file's canonical MIME type. The video cap
      # still honours FLOWCORTEX_MEDIA_UPLOAD_MAX_BYTES, its name before per-kind caps.
      max-video-bytes: ${FLOWCORTEX_MEDIA_UPLOAD_MAX_VIDEO_BYTES:${FLOWCORTEX_MEDIA_UPLOAD_MAX_BYTES:524288000}}
      max-audio-bytes: ${FLOWCORTEX_MEDIA_UPLOAD_MAX_AUDIO_BYTES:104857600}
      max-image-bytes: ${FLOWCORTEX_MEDIA_UPLOAD_MAX_IMAGE_BYTES:10485760}
      # On: an upload whose first bytes do not match its declared kind is refused. The caps apply
      # either way.
      content-check:
        enabled: ${FLOWCORTEX_MEDIA_UPLOAD_CONTENT_CHECK_ENABLED:true}
      # Each extension must map to a canonical MIME type in MediaProperties, or startup fails.
      # `extensions` is the audio/video allowlist (the only types a media capability takes as
      # input); `product-image-extensions` is the image allowlist (product-video feature). Neither
      # may be empty: an empty list fails startup, so leave the env var unset to keep the default.
      extensions: ${FLOWCORTEX_MEDIA_UPLOAD_EXTENSIONS:mp4,mov,webm,mkv,m4a,mp3,wav}
      product-image-extensions: ${FLOWCORTEX_MEDIA_UPLOAD_PRODUCT_IMAGE_EXTENSIONS:jpg,jpeg,png,webp}
      url-ttl: 15m
    s3:
      endpoint: ${S3_ENDPOINT:}
      # The host the member's browser reaches; presigned URLs are signed for it.
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      path-style: ${S3_PATH_STYLE:true}
      upload-bucket: ${S3_UPLOAD_BUCKET:flowcortex-uploads}
      bucket: ${S3_BUCKET:flowcortex-media}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
    # Bound every call the API itself makes to the store, retries included, so a store that
    # accepts the connection and never answers cannot hold a request or a health check.
      api-call-timeout: 5s
      api-call-attempt-timeout: 2s
      # Except a run-input copy: server-side, but it grows with the file (up to max-video-bytes),
      # so it has its own bound for the call and each attempt. It runs before any run transaction.
      copy-timeout: 2m
