# 'dev' Spring profile — local demo only: `./gradlew bootRun
# --args='--spring.profiles.active=dev'`, or the local docker compose stack via
# SPRING_PROFILES_ACTIVE=dev in .env (seeds the demo accounts and workflows).
# Never a deployed environment. Compose still sets JWT_SECRET explicitly, so the
# fallback below only applies to a bare bootRun.
# The value below is a deliberately obvious placeholder, not a
# real credential, so it is safe to commit.
flowcortex:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-do-not-use-elsewhere}
  # Self-registered demo accounts belong to DevDataSeeder's first admin. Compose
  # passes the variable even when unset (empty), so .env names it too.
  registration:
    owner-email: ${FLOWCORTEX_REGISTRATION_OWNER_EMAIL:admin1@flowcortex.dev}
  product-video:
    enabled: ${FLOWCORTEX_PRODUCT_VIDEO_ENABLED:true}
