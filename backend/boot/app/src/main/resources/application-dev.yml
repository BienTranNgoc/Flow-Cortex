# 'dev' Spring profile — local convenience only (e.g.
# `./gradlew bootRun --args='--spring.profiles.active=dev'`). NEVER used by
# docker compose or any deployed environment; those set JWT_SECRET explicitly
# The value below is a deliberately obvious placeholder, not a
# real credential, so it is safe to commit.
flowcortex:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-do-not-use-elsewhere}
