# 'dev' Spring profile — local demo only: `./gradlew bootRun
# --args='--spring.profiles.active=dev'`, or the local docker compose stack via
# SPRING_PROFILES_ACTIVE=dev in .env (seeds the demo accounts and workflows).
# Never a deployed environment. Compose still sets JWT_SECRET explicitly, so the
# fallback below only applies to a bare bootRun.
# The value below is a deliberately obvious placeholder, not a
# real credential, so it is safe to commit.
flowcortex:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-do-not-use-elsewhere}
  # Placeholder connector keyring for a bare bootRun; an environment value overrides it.
  connectors:
    encryption:
      current: k1
      keys:
        k1: ZGV2LW9ubHktaW5zZWN1cmUtY29ubmVjdHIta2V5ISE=
  # Placeholder TOTP key for a bare bootRun. It is used only when FLOWCORTEX_AUTH_TOTP_KEYS_K1 gives no key
  # (unset or empty), under the same key id, so the dev profile never carries two keys; the issuer tells a
  # dev enrolment from a real one.
  auth:
    totp:
      dev-key: ZGV2LW9ubHktaW5zZWN1cmUtdG90cC1rZXktazEhISE=
      issuer: Nodi (dev)
  # Placeholder share access-log hash key for a bare bootRun; an environment value overrides it.
  # The base file keeps the empty default, so every other profile still refuses to start without one.
  workflow:
    share:
      accessor-hash-secret: ${FLOWCORTEX_WORKFLOW_SHARE_HASH_SECRET:dev-only-workflow-share-hash-secret-do-not-use-elsewhere}
  # Self-registered demo accounts belong to DevDataSeeder's first admin. Compose
  # passes the variable even when unset (empty), so .env names it too.
  registration:
    owner-email: ${FLOWCORTEX_REGISTRATION_OWNER_EMAIL:admin1@flowcortex.dev}
  product-video:
    enabled: ${FLOWCORTEX_PRODUCT_VIDEO_ENABLED:false}
  # Confirmation links open the Vite dev server; mail goes to a local Mailpit.
  app:
    public-url: ${FLOWCORTEX_APP_PUBLIC_URL:http://localhost:5173}
spring:
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
