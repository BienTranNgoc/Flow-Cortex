# Most ITs upload placeholder bytes to exercise other flows; the classes that test the content
# check turn it back on with their own @SpringBootTest properties.
flowcortex.media.upload.content-check.enabled=false
# Codes land in sms_outbox, where the phone ITs read them; this also maps the admin outbox API.
flowcortex.sms.sender=outbox
flowcortex.phone.hash-secret=phone-hash-secret-for-integration-tests-0123456789
# Required while email confirmation is on; the confirmation ITs capture mail instead of sending it.
flowcortex.app.public-url=http://localhost:5173
spring.mail.host=localhost
