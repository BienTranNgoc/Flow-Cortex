# Most ITs upload placeholder bytes to exercise other flows; the classes that test the content
# check turn it back on with their own @SpringBootTest properties.
flowcortex.media.upload.content-check.enabled=false
# Codes land in sms_outbox, where the phone ITs read them; this also maps the admin outbox API.
flowcortex.sms.sender=outbox
flowcortex.phone.hash-secret=phone-hash-secret-for-integration-tests-0123456789
flowcortex.support.assistant.hash-secret=support-hash-secret-for-integration-tests-0123456789
flowcortex.workflow.share.accessor-hash-secret=workflow-share-hash-secret-for-integration-tests-0123456789
# A 32-byte base64 key for tests only.
flowcortex.connectors.encryption.current=k1
flowcortex.connectors.encryption.keys.k1=dGVzdC1jb25uZWN0b3Ita2V5LTMyLWJ5dGVzLXRlc3Q=
# Required while email confirmation is on; the confirmation ITs capture mail instead of sending it.
flowcortex.app.public-url=http://localhost:5173
spring.mail.host=localhost
# Cached IT contexts share one database, so a live runner in one would run another context's jobs.
flowcortex.jobs.runner.enabled=false
# Same reason: a live batch dispatcher in one context would start the rows of another context's batches.
# The dispatch IT turns it on for its own context.
flowcortex.workflow.batch.dispatch-enabled=false
