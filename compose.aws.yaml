# Public deploy overlay: Caddy terminates TLS on one host for the member app,
# the admin console and the object store, each on a subdomain of DOMAIN, with
# Let's Encrypt certificates. Point the app., admin. and media. A records at the
# host before the first start, or the certificate requests fail.
#
#   docker compose -f docker-compose.yml -f compose.aws.yaml up -d --build
#   -> https://app.$DOMAIN    member app
#   -> https://admin.$DOMAIN  admin console
#   -> https://media.$DOMAIN  presigned uploads and downloads
#
# Only 80 and 443 are public; every other port stays on loopback. Uploads go
# straight to media.$DOMAIN, so the store's signing host and its allowed upload
# origin follow DOMAIN here instead of the localhost values.

services:
  caddy:
    image: caddy:2.11.6-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN (see .env.example)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  minio:
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: https://app.${DOMAIN:?Set DOMAIN (see .env.example)}

  backend:
    environment:
      S3_PUBLIC_ENDPOINT: https://media.${DOMAIN:?Set DOMAIN (see .env.example)}
      # Confirmation links open the public member app, not the base file's localhost default.
      FLOWCORTEX_APP_PUBLIC_URL: https://app.${DOMAIN:?Set DOMAIN (see .env.example)}
      # Email confirmation is on, so its mail needs a real relay; the base file's Mailpit sink
      # (port 1025, no login) would swallow every confirmation and set-password link.
      # The relay takes a login, sent only once STARTTLS has encrypted the session.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?Set SPRING_MAIL_HOST to a real SMTP relay (see .env.example)}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:?Set SPRING_MAIL_PORT to the relay's STARTTLS port, usually 587 (see .env.example)}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME to the relay login (see .env.example)}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD to the relay password (see .env.example)}
      SPRING_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_SMTP_STARTTLS: "true"
      # Off until a real SMS sender exists: the dev `outbox` sender keeps codes in a DB table.
      FLOWCORTEX_SMS_SENDER: ""
      FLOWCORTEX_PHONE_VERIFICATION_ENABLED: "false"
      FLOWCORTEX_PHONE_HASH_SECRET: ""

  # Seedance and Wan read the product photo through a presigned URL on this host.
  provider-video-worker:
    environment:
      S3_PUBLIC_ENDPOINT: https://media.${DOMAIN:?Set DOMAIN (see .env.example)}

volumes:
  # Certificates and the ACME account: losing them re-requests every certificate.
  caddy_data:
  caddy_config:
