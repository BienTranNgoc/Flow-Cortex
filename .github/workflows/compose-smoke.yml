name: compose-smoke

# Builds every image, starts the whole compose stack and runs
# scripts/smoke-probe.sh: upload a clip, check it on the worker, download the
# report, see the run in the admin list, and fail a text file with probe_failed.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate .env
        # Throwaway values for this run. Hex keeps them URL-safe: the broker and
        # store credentials are placed in URLs.
        run: |
          cp .env.example .env
          for key in JWT_SECRET POSTGRES_PASSWORD RABBITMQ_DEFAULT_PASS MINIO_ROOT_PASSWORD \
                     BACKEND_S3_SECRET_KEY WORKER_S3_SECRET_KEY PROVIDER_S3_SECRET_KEY \
                     GF_SECURITY_ADMIN_PASSWORD POSTGRES_EXPORTER_PASSWORD; do
            sed -i "s|^$key=.*|$key=$(openssl rand -hex 24)|" .env
          done
          if grep -nE '^[A-Z0-9_]+=change-me' .env; then
            echo "::error::.env still holds a change-me placeholder"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,scope=worker,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
            admin.cache-from=type=gha,scope=admin
            admin.cache-to=type=gha,scope=admin,mode=max

      - name: Start the stack
        run: SPRING_PROFILES_ACTIVE=dev docker compose up -d --no-build --wait --wait-timeout 300

      - name: Readiness
        run: curl -fsS localhost:8080/readyz

      - name: Smoke
        run: scripts/smoke-probe.sh

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          docker compose ps -a > diagnostics/ps.txt
          docker compose logs --no-color --timestamps > diagnostics/logs.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-smoke-diagnostics
          path: diagnostics/
          retention-days: 3

      - name: Tear down
        if: always()
        run: docker compose down -v
