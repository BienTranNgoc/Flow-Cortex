name: contracts-ci

# contracts/*.schema.json is the single source of the media messages: the Java
# records must still validate against it and the committed Python models must
# match a fresh generation. Either side drifting fails this workflow.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Java records validate against the schemas
        run: ./gradlew --no-daemon :modules:media:test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Install
        run: uv sync --frozen --no-build

      - name: Regenerate the Python models
        run: bash scripts/gen_contracts.sh

      # diff catches edited models; status also catches a model generated for a new
      # schema that was never committed.
      - name: Check the committed models are in sync
        working-directory: .
        run: |
          git diff --exit-code worker/src/flowcortex_worker/contracts worker/src/flowcortex_worker/provider/contracts
          drift=$(git status --porcelain worker/src/flowcortex_worker/contracts worker/src/flowcortex_worker/provider/contracts)
          if [ -n "$drift" ]; then
            echo "$drift"
            exit 1
          fi

      - name: Contract tests
        run: uv run --frozen --no-build pytest tests/test_contracts.py
