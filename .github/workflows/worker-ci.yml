name: worker-ci

# Lint, type-check and test the Python media worker. The tests start the pinned
# RabbitMQ and Silo images with Testcontainers (Docker is on the hosted runner)
# and run the real ffprobe, so the runner installs ffmpeg.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        # --locked also fails when uv.lock no longer matches pyproject.toml. --no-build:
        # dependencies come from wheels only; uv still builds the worker itself.
        run: uv sync --locked --no-build

      - name: Lint
        run: uv run --frozen --no-build ruff check .

      - name: Type-check
        run: uv run --frozen --no-build mypy

      - name: Test
        run: uv run --frozen --no-build pytest -rs

  audio-engines:
    # Builds the audio image (hash-pinned packages, digest-checked models) and runs the engine
    # tests inside it with no network, so a model fetched at run time fails here, not in prod.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          python-version: '3.12'

      - name: Build the audio image
        run: docker build --target audio-runtime -t flowcortex-audio-worker:ci .

      - name: Collect the locked pytest packages
        # Pure-Python wheels at the versions uv.lock pins; the image itself carries no test tools.
        run: |
          uv export --frozen --no-emit-project --only-group dev --no-hashes \
            | grep -E '^(pytest|pluggy|iniconfig|packaging|pygments)==' > "$RUNNER_TEMP/pytest-pins.txt"
          uv pip install --quiet --target "$RUNNER_TEMP/pytest-libs" --no-deps -r "$RUNNER_TEMP/pytest-pins.txt"

      - name: Engine tests, offline
        run: |
          docker run --rm --network none \
            -v "$PWD/tests/engines:/work/tests/engines:ro" \
            -v "$PWD/eval:/work/eval:ro" \
            -v "$RUNNER_TEMP/pytest-libs:/pytest-libs:ro" \
            -e PYTHONPATH=/pytest-libs -w /work --entrypoint python \
            flowcortex-audio-worker:ci \
            -m pytest -m engines -o "markers=engines: needs the audio image" -p no:cacheprovider -rs tests/engines
