name: worker-ci

# Lint, type-check and test the Python media worker. The tests start the pinned
# RabbitMQ and Silo images with Testcontainers (Docker is on the hosted runner)
# and run the real ffprobe, so the runner installs ffmpeg.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        # --locked also fails when uv.lock no longer matches pyproject.toml. --no-build:
        # dependencies come from wheels only; uv still builds the worker itself.
        run: uv sync --locked --no-build --extra overlay

      - name: Lint
        run: uv run --frozen --no-build --extra overlay ruff check .

      - name: Type-check
        run: uv run --frozen --no-build --extra overlay mypy

      - name: Test
        run: uv run --frozen --no-build --extra overlay pytest -rs

  overlay-image:
    # Builds the overlay image and proves it cleans a captioned picture with networking off, that
    # its ffmpeg has libvidstab and that the video ops' vision child runs in it.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build overlay-runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: worker
          target: overlay-runtime
          load: true
          push: false
          tags: flowcortex-worker-overlay:ci
          cache-from: type=gha,scope=worker-overlay
          cache-to: type=gha,scope=worker-overlay,mode=max

      - name: Vidstab in the image
        run: |
          docker run --rm --network none --entrypoint sh flowcortex-worker-overlay:ci \
            -c 'ffmpeg -hide_banner -filters | grep -q vidstabdetect'

      - name: Vision child in the image
        # The child takes no path: it runs in its work directory on the files the handler's own
        # ffmpeg writes under fixed names, and each command must exit 0 and leave a result.
        run: |
          docker run --rm --network none --entrypoint sh flowcortex-worker-overlay:ci -c '
            set -e
            work=$(mktemp -d)
            cd "$work"
            mkdir frames
            clip="-f lavfi -i testsrc=size=320x180:rate=25 -t 2 -c:v libx264 -pix_fmt yuv420p"
            ffmpeg -nostdin -loglevel error $clip window.mkv
            ffmpeg -nostdin -loglevel error $clip output.mp4
            ffmpeg -nostdin -loglevel error -f lavfi -i testsrc=size=320x180:rate=1 \
              -frames:v 3 -q:v 3 frames/f_%04d.jpg
            echo "{}" > request.json
            python -m flowcortex_worker.video_ops.vision motion
            test -s result.json
            rm result.json
            echo "{\"scale\": 1}" > request.json
            python -m flowcortex_worker.video_ops.vision faces
            test -s result.json
          '

      - name: Self-check without network
        run: |
          docker run --rm --network none --entrypoint python flowcortex-worker-overlay:ci \
            -m flowcortex_worker.overlay.selfcheck

      - name: Benchmark without network
        # Exits non-zero when a size within the pixel cap is killed, exceeds 900 s or peaks above
        # 6 GiB; the printed P95, peak RSS and CPU line go into worker/README.md. `shell: bash`
        # adds pipefail, so tee does not hide that exit code.
        shell: bash
        run: |
          docker run --rm --network none --memory 6g --entrypoint python \
            -v "$PWD/worker/scripts:/bench:ro" flowcortex-worker-overlay:ci \
            /bench/bench_clean_overlay.py | tee "$GITHUB_STEP_SUMMARY"

  audio-engines:
    # Builds the audio image (hash-pinned packages, digest-checked models) and runs the engine
    # tests inside it with no network, so a model fetched at run time fails here, not in prod.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          python-version: '3.12'

      - name: Build the audio image
        run: docker build --target audio-runtime -t flowcortex-audio-worker:ci .

      - name: Collect the locked pytest packages
        # Pure-Python wheels at the versions uv.lock pins; the image itself carries no test tools.
        run: |
          uv export --frozen --no-emit-project --only-group dev --no-hashes \
            | grep -E '^(pytest|pluggy|iniconfig|packaging|pygments)==' > "$RUNNER_TEMP/pytest-pins.txt"
          uv pip install --quiet --target "$RUNNER_TEMP/pytest-libs" --no-deps -r "$RUNNER_TEMP/pytest-pins.txt"

      - name: Engine tests, offline
        run: |
          docker run --rm --network none \
            -v "$PWD/tests/engines:/work/tests/engines:ro" \
            -v "$PWD/eval:/work/eval:ro" \
            -v "$RUNNER_TEMP/pytest-libs:/pytest-libs:ro" \
            -e PYTHONPATH=/pytest-libs -w /work --entrypoint python \
            flowcortex-audio-worker:ci \
            -m pytest -m engines -o "markers=engines: needs the audio image" -p no:cacheprovider -rs tests/engines/test_engines.py

  trend-engines:
    # Builds the trend image (hash-pinned packages, digest-checked detector files), runs its engine
    # tests with no network, measures the cost of the largest job, and checks that a container
    # started before its queue exists refuses to run.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          python-version: '3.12'

      - name: Build the trend image
        run: docker build --target trend-runtime -t flowcortex-trend-worker:ci .

      - name: Collect the locked pytest packages
        # Pure-Python wheels at the versions uv.lock pins; the image itself carries no test tools.
        run: |
          uv export --frozen --no-emit-project --only-group dev --no-hashes \
            | grep -E '^(pytest|pluggy|iniconfig|packaging|pygments)==' > "$RUNNER_TEMP/pytest-pins.txt"
          uv pip install --quiet --target "$RUNNER_TEMP/pytest-libs" --no-deps -r "$RUNNER_TEMP/pytest-pins.txt"

      - name: Engine tests, offline
        # A skipped test means the image lacks a library, so the junit report is checked for skips
        # the way the preview scene tests are. The report directory is writable by user 10001.
        run: |
          mkdir -p "$RUNNER_TEMP/trend-junit"
          chmod 0777 "$RUNNER_TEMP/trend-junit"
          docker run --rm --network none \
            -v "$PWD/tests/engines:/work/tests/engines:ro" \
            -v "$RUNNER_TEMP/pytest-libs:/pytest-libs:ro" \
            -v "$RUNNER_TEMP/trend-junit:/junit" \
            -e PYTHONPATH=/pytest-libs -w /work --entrypoint python \
            flowcortex-trend-worker:ci \
            -m pytest -m engines -o "markers=engines: needs the trend image" -p no:cacheprovider -rs \
            tests/engines/test_trend_engine.py --junitxml=/junit/trend.xml
          if grep -q '<skipped' "$RUNNER_TEMP/trend-junit/trend.xml"; then
            echo "::error::a trend engine test was skipped: the image lacks transformers or the model"
            exit 1
          fi

      - name: Measure the role suggestion cost
        # Four CPUs and no network, as a production pool runs; the figures in the job log go to
        # worker/README.md. Exits non-zero when any run fails.
        run: |
          docker run --rm --cpus=4 --network none \
            -v "$PWD/scripts:/bench:ro" \
            --entrypoint python \
            flowcortex-trend-worker:ci /bench/role_suggest_bench.py

      - name: A container without a lane refuses to start
        # The image presets media.trend.jobs, a queue the role check does not know yet, so it
        # must exit 2 before it connects to anything.
        run: |
          status=0
          timeout 30 docker run --rm flowcortex-trend-worker:ci || status=$?
          if [ "$status" -ne 2 ]; then
            echo "::error::the trend image exited $status instead of refusing the unknown queue (2)"
            exit 1
          fi

  # The white-block preview: the scene script against the pinned Blender, then the
  # preview-runtime image (whose build runs its own render gate) and the render-cost
  # measurement inside it. Blender renders on Mesa's software rasteriser here, as in production.
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLENDER_VERSION: 4.5.14
      BLENDER_SHA256: 9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Restore the Blender archive
        id: blender-archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/blender-archive
          key: blender-${{ env.BLENDER_SHA256 }}

      - name: Download the Blender archive
        if: steps.blender-archive.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/blender-archive"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/blender-archive/blender.tar.xz" \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz"

      - name: Install Blender
        run: |
          echo "$BLENDER_SHA256  $RUNNER_TEMP/blender-archive/blender.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender-archive/blender.tar.xz" --strip-components=1 \
            -C "$RUNNER_TEMP/blender"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"

      - name: Install ffmpeg and the software GL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 \
            libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Install
        run: uv sync --locked --no-build

      - name: Scene tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          uv run --frozen --no-build pytest tests/test_preview_scene.py -rs \
            --junitxml="$RUNNER_TEMP/scene.xml"
          if grep -q '<skipped' "$RUNNER_TEMP/scene.xml"; then
            echo "::error::a scene test was skipped: BLENDER_BIN did not reach the tests"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the preview-runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: worker
          platforms: linux/amd64
          target: preview-runtime
          load: true
          tags: flowcortex-worker-preview:ci
          cache-from: type=gha,scope=worker-preview
          cache-to: type=gha,scope=worker-preview,mode=max

      - name: Measure the render cost
        # No --device: the container sees no GPU, so Blender renders on llvmpipe, as production does.
        run: |
          docker run --rm --cpus=4 --network none \
            -v "$GITHUB_WORKSPACE/worker/tests/fixtures/preview:/fixtures:ro" \
            -v "$GITHUB_WORKSPACE/worker/scripts/preview_bench.py:/bench/preview_bench.py:ro" \
            --entrypoint /app/.venv/bin/python \
            flowcortex-worker-preview:ci /bench/preview_bench.py /fixtures
