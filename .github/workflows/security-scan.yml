name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans dependencies + IaC/Dockerfile misconfig + committed secrets.
      # Report-only for now (exit-code 0), same "measure first, gate later"
      # stance as JaCoCo: flip exit-code to '1' to make it a merge gate.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table
