name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` compiles and runs `check` (tests, Checkstyle, the JaCoCo
      # coverage-floor gate — design.md D7/ADR-0004) plus the JaCoCo report.
      # The test suite also regenerates docs/openapi.yaml (task 3.1) as a
      # side effect, which the next step diff-checks for drift.
      - name: Build + test
        run: ./gradlew --no-daemon build

      # Contract-first drift check (design.md D6, task 3.3): the snapshot
      # test above just rewrote docs/openapi.yaml from the live /v3/api-docs
      # document — if a controller change wasn't followed by regenerating
      # the committed snapshot, the working tree now differs from HEAD.
      - name: Check OpenAPI snapshot is in sync
        working-directory: .
        run: git diff --exit-code docs/openapi.yaml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/boot/app/build/reports/jacoco/test/html
          if-no-files-found: ignore
