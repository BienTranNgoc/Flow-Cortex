name: backend-ci

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  modules-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Builds bootJar and runs check (tests, Checkstyle, JaCoCo 50% floor) for all modules and
      # shared libraries, plus Checkstyle on :boot:app. :boot:app ITs run sharded in parallel.
      - name: Build modules + Checkstyle
        run: >-
          ./gradlew --no-daemon build
          -x :boot:app:test
          -x :boot:app:multiInstanceTest
          -x :boot:app:jacocoTestReport
          -x :boot:app:jacocoTestCoverageVerification

      - name: Test migration version guard
        working-directory: .
        run: bash scripts/check-migration-version.test.sh

      # Block migrations whose version is not newer than the latest on
      # origin/development (AGENTS.md §15). Must fetch first so the ref exists
      # in the shallow CI checkout.
      - name: Check migration versions
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/development:refs/remotes/origin/development
          bash scripts/check-migration-version.sh origin/development

  app-it:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run :boot:app test shard ${{ matrix.shard }}/4
        run: >-
          ./gradlew --no-daemon :boot:app:test
          -PtestShardIndex=${{ matrix.shard }}
          -PtestShardTotal=4
          -x :boot:app:jacocoTestReport

      - name: Upload shard coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jacoco-exec-shard-${{ matrix.shard }}
          path: backend/boot/app/build/jacoco/test.exec
          retention-days: 30
          if-no-files-found: error

  app-multi-instance-and-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run OpenAPI snapshot test and multi-instance ITs
        run: >-
          ./gradlew --no-daemon
          :boot:app:test --tests "com.flowcortex.app.openapi.OpenApiSnapshotTest"
          :boot:app:multiInstanceTest
          -x :boot:app:jacocoTestReport

      # Contract-first drift check: the snapshot test just rewrote docs/openapi.yaml
      # from the live /v3/api-docs; an unregenerated snapshot now differs from HEAD.
      - name: Check OpenAPI snapshot is in sync
        working-directory: .
        run: git diff --exit-code docs/openapi.yaml

      - name: Upload multi-instance coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jacoco-exec-multi
          path: |
            backend/boot/app/build/jacoco/multiInstanceTest.exec
            backend/boot/app/build/jacoco/test.exec
          retention-days: 30
          if-no-files-found: error

  jacoco-verify:
    needs: [app-it, app-multi-instance-and-openapi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Download sharded coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: backend-jacoco-exec-*
          path: backend/boot/app/build/jacoco-merged
          merge-multiple: false

      - name: Verify all expected coverage files are present
        working-directory: .
        run: |
          for f in \
            backend/boot/app/build/jacoco-merged/backend-jacoco-exec-shard-0/test.exec \
            backend/boot/app/build/jacoco-merged/backend-jacoco-exec-shard-1/test.exec \
            backend/boot/app/build/jacoco-merged/backend-jacoco-exec-shard-2/test.exec \
            backend/boot/app/build/jacoco-merged/backend-jacoco-exec-shard-3/test.exec \
            backend/boot/app/build/jacoco-merged/backend-jacoco-exec-multi/multiInstanceTest.exec \
            backend/boot/app/build/jacoco-merged/backend-jacoco-exec-multi/test.exec; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty JaCoCo execution data file: $f"
              exit 1
            fi
          done

      - name: Verify merged coverage floor (ADR-0004)
        run: ./gradlew --no-daemon :boot:app:jacocoMergedReport :boot:app:jacocoMergedCoverageVerification

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jacoco
          path: backend/boot/app/build/reports/jacoco/test/html
          if-no-files-found: ignore
