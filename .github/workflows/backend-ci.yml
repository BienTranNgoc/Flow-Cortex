name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # `build` runs `check` (tests, Checkstyle, JaCoCo coverage floor — ADR-0004).
      # The test suite also regenerates docs/openapi.yaml, which the next step diff-checks.
      - name: Build + test
        run: ./gradlew --no-daemon build

      # Contract-first drift check: the snapshot test just rewrote docs/openapi.yaml
      # from the live /v3/api-docs; an unregenerated snapshot now differs from HEAD.
      - name: Check OpenAPI snapshot is in sync
        working-directory: .
        run: git diff --exit-code docs/openapi.yaml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jacoco
          path: backend/boot/app/build/reports/jacoco/test/html
          if-no-files-found: ignore
