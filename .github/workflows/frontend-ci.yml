name: frontend-ci

on:
  push:
    branches: [main, development]
    paths:
      - 'frontend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Contract-first drift check: regenerate the typed client from the committed
      # docs/openapi.yaml and fail if it differs from what's committed.
      - name: Generate API client
        run: npm run gen:api

      - name: Check generated API client is in sync
        working-directory: .
        run: git diff --exit-code frontend/src/api/generated

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
