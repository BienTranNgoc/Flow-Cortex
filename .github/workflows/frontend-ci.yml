name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Contract-first drift check: regenerate the typed client from the committed
      # docs/openapi.yaml and fail if it differs from what's committed.
      - name: Generate API client
        run: npm run gen:api

      - name: Check generated API client is in sync
        working-directory: .
        run: git diff --exit-code frontend/src/api/generated

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
