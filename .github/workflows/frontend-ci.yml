name: frontend-ci

on:
  push:
    branches: [main, development]
    paths:
      - 'frontend/**'
      - 'admin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc'
      - 'docs/openapi.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'admin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.prettierrc'
      - 'docs/openapi.yaml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Contract-first drift check: regenerate the typed client from the committed
      # docs/openapi.yaml and fail if it differs from what's committed.
      - name: Generate API client
        run: npm run gen:api -w @flow-cortex/api-client

      # diff catches an edited file; status also catches a generated file never committed.
      - name: Check generated API client is in sync
        run: |
          git diff --exit-code packages/api-client/src/generated
          drift=$(git status --porcelain packages/api-client/src/generated)
          if [ -n "$drift" ]; then
            echo "$drift"
            exit 1
          fi

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Type-check
        run: npm run typecheck --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present
