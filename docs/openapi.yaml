openapi: 3.1.0
info:
  title: FlowCortex API
  version: v1.0
servers:
- url: /
security:
- BearerAuth: []
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - users-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - users-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - users-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/me/password:
    put:
      tags:
      - password-controller
      operationId: setPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/profile:
    put:
      tags:
      - auth-controller
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/workflows/{id}/runs:
    post:
      tags:
      - workflows-controller
      operationId: startRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/users:
    get:
      tags:
      - users-controller
      operationId: list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
    post:
      tags:
      - users-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/uploads:
    post:
      tags:
      - uploads-controller
      operationId: requestUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /api/v1/runs/{id}/cancel:
    post:
      tags:
      - runs-controller
      operationId: cancelRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/review-tasks/{taskId}/revisions:
    get:
      tags:
      - review-tasks-controller
      operationId: getRevisions
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptRevisionResponse"
    post:
      tags:
      - review-tasks-controller
      operationId: saveRevision
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScriptRevisionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptRevisionResponse"
  /api/v1/review-tasks/{taskId}/reject:
    post:
      tags:
      - review-tasks-controller
      operationId: rejectTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTaskResponse"
  /api/v1/review-tasks/{taskId}/approve:
    post:
      tags:
      - review-tasks-controller
      operationId: approveTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveReviewTaskRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTaskResponse"
  /api/v1/product-videos/runs:
    post:
      tags:
      - product-videos-controller
      operationId: startProductVideoRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVideoRunRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/me/phone/verify:
    post:
      tags:
      - phone-controller
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneResponse"
  /api/v1/me/phone/send-code:
    post:
      tags:
      - phone-controller
      operationId: sendCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCodeResponse"
  /api/v1/auth/resend-confirmation:
    post:
      tags:
      - auth-controller
      operationId: resendConfirmation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendConfirmationRequest"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationSentResponse"
      security: []
  /api/v1/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationSentResponse"
      security: []
  /api/v1/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/auth/password-link:
    post:
      tags:
      - auth-controller
      operationId: openPasswordLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmEmailResponse"
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        "204":
          description: No Content
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
      security: []
  /api/v1/auth/confirm-email:
    post:
      tags:
      - auth-controller
      operationId: confirmEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmEmailResponse"
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/workflows:
    get:
      tags:
      - workflows-controller
      operationId: listWorkflows
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowResponse"
  /api/v1/workflows/{id}:
    get:
      tags:
      - workflows-controller
      operationId: getWorkflow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
  /api/v1/runs/{runId}/review-tasks:
    get:
      tags:
      - review-tasks-controller
      operationId: getReviewTasks
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewTaskResponse"
  /api/v1/runs/{id}:
    get:
      tags:
      - runs-controller
      operationId: getRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/runs/{id}/steps/{order}/outputs/{name}/url:
    get:
      tags:
      - runs-controller
      operationId: getOutputUrl
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputUrlResponse"
  /api/v1/me/phone:
    get:
      tags:
      - phone-controller
      operationId: current
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneResponse"
  /api/v1/health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/features:
    get:
      tags:
      - features-controller
      operationId: features
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesResponse"
      security: []
  /api/v1/credits/balance:
    get:
      tags:
      - credits-controller
      operationId: balance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
  /api/v1/capabilities:
    get:
      tags:
      - capabilities-controller
      operationId: capabilities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /api/v1/auth/oauth/google/callback:
    get:
      tags:
      - o-auth-controller
      operationId: callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: "Signed in: refresh cookie set, redirect to the return path.\
            \ Refused: redirect to /login?oauth_error=<cancelled|invalid_state|registration_closed|link_required|account_inactive|rate_limited|failed>"
      security: []
  /api/v1/auth/oauth/google/authorize:
    get:
      tags:
      - o-auth-controller
      operationId: authorize
      parameters:
      - name: remember_me
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: return_to
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Redirect to Google's consent screen
        "503":
          description: Google sign-in is not configured
      security: []
  /api/v1/auth/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/admin/sms-outbox:
    get:
      tags:
      - admin-sms-outbox-controller
      operationId: listAdminSmsOutbox
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmsOutboxEntryResponse"
  /api/v1/admin/runs:
    get:
      tags:
      - admin-runs-controller
      operationId: listAdminRuns
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 21474836
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - running
          - waiting_approval
          - completed
          - error
          - cancelling
          - cancelled
          pattern: running|waiting_approval|completed|error|cancelling|cancelled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageViewAdminRunResponse"
  /api/v1/admin/media/jobs:
    get:
      tags:
      - admin-runs-controller
      operationId: listAdminMediaJobs
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 21474836
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - running
          - completed
          - error
          pattern: pending|running|completed|error
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageViewMediaJobResponse"
components:
  schemas:
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          pattern: ADMIN|MEMBER|CREATOR
        status:
          type: string
          pattern: ACTIVE|SUSPENDED
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SetPasswordRequest:
      type: object
      properties:
        passwordSetupToken:
          type: string
          maxLength: 128
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
        firstName:
          type: string
          maxLength: 100
          minLength: 0
        lastName:
          type: string
          maxLength: 100
          minLength: 0
        username:
          type: string
          pattern: "^[a-z0-9_]{3,20}$"
      required:
      - firstName
      - lastName
      - password
      - passwordSetupToken
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
      - name
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        hasPassword:
          type: boolean
        passwordSetupRequired:
          type: boolean
    StartRunRequest:
      type: object
      properties:
        input:
          type: string
          maxLength: 10000
          minLength: 0
        uploadId:
          type: string
          format: uuid
        uploadIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
        originalName:
          type: string
          maxLength: 1024
          minLength: 0
        acknowledgeCost:
          type: boolean
    RunResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        status:
          type: string
        input:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RunStepResponse"
        chargedCredits:
          type: integer
          format: int64
    RunStepOutputResponse:
      type: object
      properties:
        name:
          type: string
        mime:
          type: string
        bytes:
          type: integer
          format: int64
      required:
      - bytes
      - mime
      - name
    RunStepResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stepOrder:
          type: integer
          format: int32
        type:
          type: string
        status:
          type: string
        input:
          type: string
        output:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        progressPercent:
          type: integer
          format: int32
        attempt:
          type: integer
          format: int32
        errorCode:
          type: string
        deliveryCount:
          type: integer
          format: int32
        pickedUpAt:
          type: string
          format: date-time
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/RunStepOutputResponse"
        mode:
          type: string
          enum:
          - inline
          - remote
      required:
      - attempt
      - deliveryCount
      - mode
      - outputs
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 72
          minLength: 8
        name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
          pattern: ADMIN|MEMBER|CREATOR
      required:
      - email
      - name
      - password
      - role
    UploadRequest:
      type: object
      properties:
        fileName:
          type: string
          maxLength: 255
          minLength: 0
        size:
          type: integer
          format: int64
      required:
      - fileName
      - size
    UploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        url:
          type: string
        method:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        maxBytes:
          type: integer
          format: int64
      required:
      - expiresAt
      - headers
      - maxBytes
      - method
      - uploadId
      - url
    CreateScriptRevisionRequest:
      type: object
      properties:
        content:
          type: string
          maxLength: 8000
          minLength: 0
        expectedVersion:
          type: integer
          format: int64
      required:
      - content
      - expectedVersion
    ScriptRevisionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        reviewTaskId:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          format: int32
        content:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        reviewTaskVersion:
          type: integer
          format: int64
    ReviewTaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        runStepId:
          type: string
          format: uuid
        reviewType:
          type: string
        status:
          type: string
        originalPayload:
          type: string
        reviewedPayload:
          type: string
        reviewedBy:
          type: string
          format: uuid
