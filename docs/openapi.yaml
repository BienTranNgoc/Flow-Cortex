components:
  schemas:
    ReorderStepsRequest:
      type: object
      properties:
        stepIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 32767
          minItems: 0
      required:
      - stepIds
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    HelpfulRequest:
      type: object
      properties:
        helpful:
          type: boolean
      required:
      - helpful
    HelpfulResponse:
      type: object
      properties:
        helpful:
          type: boolean
        helpfulCount:
          type: integer
          format: int32
      required:
      - helpful
      - helpfulCount
    ReviewRequest:
      type: object
      properties:
        rating:
          type: string
          maximum: 5
          minimum: 1
        body:
          type:
          - string
          - "null"
          maxLength: 5000
        images:
          type:
          - array
          - "null"
          items:
            type: string
            format: uuid
    ReviewImageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - id
      - url
    ReviewResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rating:
          type: integer
          format: int32
        body:
          type:
          - string
          - "null"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ReviewImageResponse"
        helpfulCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - createdAt
      - helpfulCount
      - id
      - images
      - rating
      - updatedAt
    PutDataEntryRequest:
      type: object
      properties:
        value:
          description: Any JSON value
        dataType:
          type:
          - string
          - "null"
      required:
      - value
    DataEntryResponse:
      type: object
