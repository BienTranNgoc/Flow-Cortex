      type: object
      properties:
        title:
          type: string
          maxLength: 80
    ChatConversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        lastActivityAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
