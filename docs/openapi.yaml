components:
  schemas:
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          pattern: ADMIN|MEMBER|CREATOR
        status:
          type: string
          pattern: ACTIVE|SUSPENDED
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SetPasswordRequest:
      type: object
      properties:
        passwordSetupToken:
          type: string
          maxLength: 128
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
        firstName:
          type: string
          maxLength: 100
          minLength: 0
        lastName:
          type: string
          maxLength: 100
          minLength: 0
        username:
          type: string
          pattern: "^[a-z0-9_]{3,20}$"
      required:
      - firstName
      - lastName
      - password
      - passwordSetupToken
    ProblemDetail:
      type: object
      properties:
        type:
