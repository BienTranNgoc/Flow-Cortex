      type: object
      properties:
        phone:
          type: string
          description: "Verified number in E.164, or null"
        verified:
          type: boolean
        maskedPhone:
          type: string
          description: The verified number as shown to the member (carrier digit and
            last three digits)
      required:
      - verified
    SendCodeRequest:
      type: object
      properties:
