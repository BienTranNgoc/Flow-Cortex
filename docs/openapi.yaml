          type: integer
          format: int64
    ProductVideoRunRequest:
      type: object
      properties:
        productName:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 4000
          minLength: 0
        cta:
          type: string
          maxLength: 500
          minLength: 0
        price:
          type: string
          maxLength: 200
          minLength: 0
        promotion:
          type: string
          maxLength: 500
          minLength: 0
        uploadIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
        video:
          $ref: "#/components/schemas/VideoConfig"
        acknowledgeCost:
          type: boolean
      required:
      - cta
      - description
      - productName
      - uploadIds
      - video
    VideoConfig:
      type: object
      properties:
        aspectRatio:
          type: string
          pattern: 9:16
      required:
      - aspectRatio
