openapi: 3.1.0
info:
  title: FlowCortex API
  version: v1.0
servers:
- url: /
security:
- BearerAuth: []
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - users-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - users-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - users-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/auth/profile:
    put:
      tags:
      - auth-controller
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/workflows/{id}/runs:
    post:
      tags:
      - workflows-controller
      operationId: startRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/users:
    get:
      tags:
      - users-controller
      operationId: list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
    post:
      tags:
      - users-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/uploads:
    post:
      tags:
      - uploads-controller
      operationId: requestUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /api/v1/review-tasks/{taskId}/reject:
    post:
      tags:
      - review-tasks-controller
      operationId: rejectTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTaskResponse"
  /api/v1/review-tasks/{taskId}/approve:
    post:
      tags:
      - review-tasks-controller
      operationId: approveTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveReviewTaskRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTaskResponse"
  /api/v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/v1/workflows:
    get:
      tags:
      - workflows-controller
      operationId: listWorkflows
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowResponse"
  /api/v1/workflows/{id}:
    get:
      tags:
      - workflows-controller
      operationId: getWorkflow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
  /api/v1/runs/{runId}/review-tasks:
    get:
      tags:
      - review-tasks-controller
      operationId: getReviewTasks
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewTaskResponse"
  /api/v1/runs/{id}:
    get:
      tags:
      - runs-controller
      operationId: getRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/runs/{id}/steps/{order}/outputs/{name}/url:
    get:
      tags:
      - runs-controller
      operationId: getOutputUrl
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: order
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputUrlResponse"
  /api/v1/health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/admin/runs:
    get:
      tags:
      - admin-runs-controller
      operationId: listAdminRuns
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 21474836
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - running
          - completed
          - error
          pattern: running|completed|error
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageViewAdminRunResponse"
  /api/v1/admin/media/jobs:
    get:
      tags:
      - admin-runs-controller
      operationId: listAdminMediaJobs
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 21474836
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - running
          - completed
          - error
          pattern: pending|running|completed|error
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageViewMediaJobResponse"
components:
  schemas:
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          pattern: ADMIN|MEMBER
        status:
          type: string
          pattern: ACTIVE|SUSPENDED
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
      - name
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
        status:
          type: string
    StartRunRequest:
      type: object
      properties:
        input:
          type: string
          maxLength: 10000
          minLength: 0
        uploadId:
          type: string
          format: uuid
        originalName:
          type: string
          maxLength: 1024
          minLength: 0
    RunResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        status:
          type: string
        input:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RunStepResponse"
    RunStepOutputResponse:
      type: object
      properties:
        name:
          type: string
        mime:
          type: string
        bytes:
          type: integer
          format: int64
      required:
      - bytes
      - mime
      - name
    RunStepResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stepOrder:
          type: integer
          format: int32
        type:
          type: string
        status:
          type: string
        input:
          type: string
        output:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        progressPercent:
          type: integer
          format: int32
        attempt:
          type: integer
          format: int32
        errorCode:
          type: string
        deliveryCount:
          type: integer
          format: int32
        pickedUpAt:
          type: string
          format: date-time
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/RunStepOutputResponse"
        mode:
          type: string
          enum:
          - inline
          - remote
      required:
      - attempt
      - deliveryCount
      - mode
      - outputs
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 72
          minLength: 8
        name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
          pattern: ADMIN|MEMBER
      required:
      - email
      - name
      - password
      - role
    UploadRequest:
      type: object
      properties:
        fileName:
          type: string
          maxLength: 255
          minLength: 0
        size:
          type: integer
          format: int64
      required:
      - fileName
      - size
    UploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        url:
          type: string
        method:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        maxBytes:
          type: integer
          format: int64
      required:
      - expiresAt
      - headers
      - maxBytes
      - method
      - uploadId
      - url
    ReviewTaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        runStepId:
          type: string
          format: uuid
        reviewType:
          type: string
        status:
          type: string
        originalPayload:
          type: string
        reviewedPayload:
          type: string
        reviewedBy:
          type: string
          format: uuid
        reviewedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ApproveReviewTaskRequest:
      type: object
      properties:
        reviewedPayload:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
    WorkflowResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isShared:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStepResponse"
    WorkflowStepResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stepOrder:
          type: integer
          format: int32
        name:
          type: string
        type:
          type: string
        mode:
          type: string
          enum:
          - inline
          - remote
      required:
      - mode
    OutputUrlResponse:
      type: object
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - expiresAt
      - url
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: Overall service health status.
          example: UP
        service:
          type: string
          description: Identifier of the service reporting its health.
          example: flow-cortex
    AdminRunResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workflowName:
          type: string
        ownerEmail:
          type: string
        status:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
      - id
      - startedAt
      - status
      - workflowName
    PageViewAdminRunResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRunResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
      required:
      - items
      - page
      - size
      - total
    MediaJobResponse:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        stepOrder:
          type: integer
          format: int32
        capability:
          type: string
        status:
          type: string
        attempt:
          type: integer
          format: int32
        deliveryCount:
          type: integer
          format: int32
        pickedUpAt:
          type: string
          format: date-time
        queueDeadline:
          type: string
          format: date-time
        leaseUntil:
          type: string
          format: date-time
        runDeadline:
          type: string
          format: date-time
        progressPercent:
          type: integer
          format: int32
        errorCode:
          type: string
        errorMessage:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
      - attempt
      - capability
      - deliveryCount
      - jobId
      - runId
      - status
      - stepOrder
    PageViewMediaJobResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaJobResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
      required:
      - items
      - page
      - size
      - total
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
