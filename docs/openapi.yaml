openapi: 3.1.0
info:
  title: FlowCortex API
  version: v1.0
servers:
- url: /
security:
- BearerAuth: []
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - users-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - users-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - users-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
  /api/v1/me/password:
    put:
      tags:
      - password-controller
      operationId: setPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/chat/conversations/{id}:
    put:
      tags:
      - conversation-controller
      operationId: renameChatConversation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatConversationTitle"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        "400":
          description: validation-failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: chat-conversation-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - conversation-controller
      operationId: deleteChatConversation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "404":
          description: chat-conversation-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/auth/profile:
    put:
      tags:
      - auth-controller
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/admin/support/settings:
    get:
      tags:
      - admin-support-settings-controller
      operationId: getAdminSupportSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportSettings"
    put:
      tags:
      - admin-support-settings-controller
      operationId: updateAdminSupportSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSupportSettingsUpdate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportSettings"
        "400":
          description: validation-failed (errors.assistantEnabled)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/admin/support/requests/{number}/status:
    put:
      tags:
      - admin-request-controller
      operationId: setAdminSupportRequestStatus
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSupportRequestStatusChange"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportRequestDetail"
        "400":
          description: validation-failed (errors.status)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: request-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "transition-not-allowed, request-state-changed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/admin/support/kb/groups/{id}:
    put:
      tags:
      - admin-kb-controller
      operationId: renameAdminSupportKbGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSupportKbGroupRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportKbGroup"
        "400":
          description: validation-failed (errors)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: group-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: group-name-taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
      - admin-kb-controller
      operationId: deleteAdminSupportKbGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "404":
          description: group-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: group-not-empty (articleCount)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/admin/support/kb/groups/order:
    put:
      tags:
      - admin-kb-controller
      operationId: reorderAdminSupportKbGroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSupportKbGroupOrder"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSupportKbGroup"
        "400":
          description: "validation-failed (errors), group-order-mismatch"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/admin/support/kb/articles/{id}:
    get:
      tags:
      - admin-kb-controller
      operationId: getAdminSupportKbArticle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportKbArticle"
        "404":
          description: article-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
      - admin-kb-controller
      operationId: updateAdminSupportKbArticle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSupportKbArticleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSupportKbArticle"
        "400":
          description: validation-failed (errors)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "article-not-found, group-not-found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "slug-taken, featured-full, featured-position-taken"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/admin/chat/settings:
    get:
      tags:
      - admin-chat-settings-controller
      operationId: getAdminChatSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChatSettings"
    put:
      tags:
      - admin-chat-settings-controller
      operationId: updateAdminChatSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChatSettingsUpdate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChatSettings"
        "400":
          description: validation-failed (errors.enabled)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/workflows/{id}/runs:
    post:
      tags:
      - workflows-controller
      operationId: startRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/users:
    get:
      tags:
      - users-controller
      operationId: list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
    post:
      tags:
      - users-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/uploads:
    post:
      tags:
      - uploads-controller
      operationId: requestUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /api/v1/support/uploads:
    post:
      tags:
      - request-controller
      operationId: requestSupportUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportUploadRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportUploadGrant"
        "400":
          description: "validation-failed (errors), attachment-rejected"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "support-disabled, attachments-unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/support/requests:
    get:
      tags:
      - request-controller
      operationId: listSupportRequests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportRequestSummary"
        "503":
          description: support-disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
      - request-controller
      operationId: createSupportRequest
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportRequestCreate"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestDetail"
        "400":
          description: "validation-failed (errors), attachment-rejected"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: idempotency-key-reused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "support-disabled, attachments-unavailable (uploadIds sent)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/support/requests/{number}/messages:
    post:
      tags:
      - request-controller
      operationId: replyToSupportRequest
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportRequestReply"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestDetail"
        "400":
          description: "validation-failed (errors), attachment-rejected"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: request-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "request-closed, request-state-changed, idempotency-key-reused"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "support-disabled, attachments-unavailable (uploadIds sent)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/support/requests/{number}/confirm:
    post:
      tags:
      - request-controller
      operationId: confirmSupportRequest
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestDetail"
        "404":
          description: request-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "request-closed, transition-not-allowed, request-state-changed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: support-disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/support/requests/{number}/cancel:
    post:
      tags:
      - request-controller
      operationId: cancelSupportRequest
      parameters:
      - name: number
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestDetail"
        "404":
          description: request-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "request-closed, transition-not-allowed, request-state-changed"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: support-disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/support/assistant/messages:
    post:
      tags:
      - assistant-controller
      operationId: askSupportAssistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportAssistantQuestion"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAssistantReply"
        "400":
          description: "validation-failed, question-too-long"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: conversation-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: assistant-quota (retryAt)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "support-disabled, assistant-disabled, assistant-paused (retryAt),\
            \ assistant-unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/support/assistant/guest/messages:
    post:
      tags:
      - assistant-controller
      operationId: askSupportAssistantAsGuest
      parameters:
      - name: X-Support-Session
        in: header
        description: Version 4 UUID the browser keeps for the guest
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportAssistantQuestion"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAssistantReply"
        "400":
          description: "validation-failed (also for a missing or invalid X-Support-Session),\
            \ question-too-long"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: conversation-not-found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: assistant-quota (retryAt)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "support-disabled, assistant-disabled, assistant-paused (retryAt),\
            \ assistant-unavailable"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/runs/{id}/cancel:
    post:
      tags:
      - runs-controller
      operationId: cancelRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/review-tasks/{taskId}/revisions:
    get:
      tags:
      - review-tasks-controller
      operationId: getRevisions
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptRevisionResponse"
    post:
      tags:
      - review-tasks-controller
      operationId: saveRevision
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScriptRevisionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptRevisionResponse"
  /api/v1/review-tasks/{taskId}/reject:
    post:
      tags:
      - review-tasks-controller
      operationId: rejectTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTaskResponse"
  /api/v1/review-tasks/{taskId}/approve:
    post:
      tags:
      - review-tasks-controller
      operationId: approveTask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveReviewTaskRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTaskResponse"
  /api/v1/product-videos/runs:
    post:
      tags:
      - product-videos-controller
      operationId: startProductVideoRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVideoRunRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
  /api/v1/me/phone/verify:
    post:
      tags:
      - phone-controller
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneResponse"
  /api/v1/me/phone/send-code:
    post:
      tags:
      - phone-controller
      operationId: sendCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCodeResponse"
  /api/v1/email-links/{token}/unsubscribe:
    post:
      tags:
      - email-links-controller
      operationId: unsubscribeEmailLink
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: src
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLinkUnsubscribed"
        "404":
          description: This unsubscribe link is not valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Too many attempts with this link. Try again later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
  /api/v1/email-links/{token}/one-click:
    post:
      tags:
      - email-links-controller
      operationId: oneClickUnsubscribeEmailLink
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: src
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
