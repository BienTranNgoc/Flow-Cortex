[project]
name = "flowcortex-worker"
version = "0.1.0"
description = "Flow-Cortex media worker: consumes media jobs from RabbitMQ and reads/writes the object store."
requires-python = ">=3.12"
# No HTTP client of its own: the worker fetches nothing by URL, only objects from the store.
# OpenAI SDK is used by the provider container (a separate runtime); it shares this same image
# because the worker import graph and the provider import graph share `flowcortex_worker.*`.
dependencies = [
    "pika>=1.3",
    "boto3>=1.40",
    "pydantic>=2",
    "pydantic-settings>=2",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-botocore==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "openai>=1.50,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "testcontainers[minio]>=4",
    "ruff>=0.13",
    "mypy>=1.18",
    "datamodel-code-generator>=0.34",
    "jsonschema>=4.26",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated from contracts/*.schema.json by scripts/gen_contracts.sh; CI diffs it instead.
extend-exclude = ["src/flowcortex_worker/contracts", "src/flowcortex_worker/provider/contracts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information is published for these.
module = ["pika.*", "boto3.*", "botocore.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
