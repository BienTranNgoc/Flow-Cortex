[project]
name = "flowcortex-provider-worker"
version = "0.1.0"
description = "Flow-Cortex provider worker capability core."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.34",
    "pytest>=8",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/flowcortex_provider_worker/contracts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
