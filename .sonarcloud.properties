# SonarCloud automatic-analysis scope.
#
# - packages/api-client/src/generated: regenerated from docs/openapi.yaml (drift-checked in
#   CI), never hand-maintained, so its shape is not ours to lint.
# - worker/src/flowcortex_worker/contracts: pydantic models generated from contracts/*.schema.json
#   (drift-checked in contracts-ci), for the same reason.
# - *.sql: PostgreSQL. SonarCloud ships only Oracle PL/SQL and T-SQL rules, so every
#   finding on these files (e.g. "use VARCHAR2") is dialect noise.
sonar.exclusions=packages/api-client/src/generated/**,worker/src/flowcortex_worker/contracts/**,**/*.sql
