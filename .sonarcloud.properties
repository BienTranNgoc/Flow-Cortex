# SonarCloud automatic-analysis scope.
#
# - frontend/src/api/generated: regenerated from docs/openapi.yaml (drift-checked in CI),
#   never hand-maintained, so its shape is not ours to lint.
# - *.sql: PostgreSQL. SonarCloud ships only Oracle PL/SQL and T-SQL rules, so every
#   finding on these files (e.g. "use VARCHAR2") is dialect noise.
sonar.exclusions=frontend/src/api/generated/**,**/*.sql
